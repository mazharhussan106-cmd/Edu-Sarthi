# Builds the Edusarthi Android app (Trusted Web Activity in android/) and
# attaches the APK to the run, so an installable build exists without anyone
# needing Android Studio.
#
# It builds a debug APK only. Release builds are signed with the upload key,
# which never leaves the owner's machine — see android/README.md.

name: Android app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace -PtwaHost=${{ vars.TWA_HOST || 'edusarthi.com' }}

      - name: Print the debug signing fingerprint
        # Needed only to test verified links on a debug build: add this value
        # to ANDROID_CERT_SHA256 on the website. It changes on every CI run
        # because each runner generates its own debug key.
        # The debug key's location depends on the Android Gradle Plugin
        # version, so it is found rather than assumed.
        run: |
          ks=$(find ~ -name debug.keystore -print -quit 2>/dev/null)
          if [ -n "$ks" ]; then keytool -list -v -keystore "$ks" -storepass android | grep "SHA256:"; else echo "No debug keystore found"; fi

      - uses: actions/upload-artifact@v5
        with:
          name: edusarthi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
