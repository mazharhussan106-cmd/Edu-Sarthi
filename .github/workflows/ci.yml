# Checks every pull request and every push to main: the types compile and the
# production build passes. It exists because nothing else ran either, so a
# broken build could reach the live site the moment someone merged it.
#
# It deliberately uses placeholder database and auth values and never touches a
# real database or any secret; the build only needs them to exist.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-only-not-a-secret
      AUTH_TRUST_HOST: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npx next build
