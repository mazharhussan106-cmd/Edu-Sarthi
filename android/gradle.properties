# Gradle and Android build settings for the Edusarthi TWA.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# The website the app opens. Override per build without editing this file:
#   gradlew assembleRelease -PtwaHost=staging.edusarthi.com
# The Vercel address, not edusarthi.com: that domain's DNS still points at
# Hostinger, so an app opening it never reached the live site. Switch back
# once edusarthi.com is added to the Vercel project.
twaHost=edu-sarthi-nine.vercel.app
