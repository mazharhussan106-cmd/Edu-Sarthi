ole or secret key = server only, bypasses RLS.", "example_1": "A browser app using the anon key to fetch a user's own tasks.", "example_2": "A scheduled job using the service role key to clean old rows.", "example_3": "A leaked service role key forcing an immediate rotation.", "related": "Row Level Security, environment variables, Auth, secrets", "word_family": "anon, authenticated, service_role, publishable, secret", "where_used": "Every Supabase app | Security reviews | Backend jobs", "mini_conversation": "A: Can I use the service role key in my React app? | B: No, anyone could read it and bypass all your security rules.", "misconception": "✗ The service role key is fine in the browser because the site is private → ✓ Anything in front-end code can be read, so the service role key must never be there", "contrast": "anon vs service role: anon is limited by RLS, service role bypasses it.", "avoid": "Never put the service role key in front-end code or a public repository.", "memory_trick": "Anon for the app, service role for the server.", "real_project": "Keeping the service role key only in a server-side job and the anon key in the web app.", "real_interview": "An interviewer may ask: What is the difference between the anon key and the service role key?", "real_daily": "It is like a visitor badge versus the master key of a building.", "mcq_question": "Which key bypasses Row Level Security?", "mcq_options": "A) The service role key B) The anon key C) The project URL D) The region", "mcq_answer": "A", "mcq_why": "The service role key has full access and ignores RLS.", "fill_blank": "The key that is safe for browsers is the ____ key → anon", "apply": "A scheduled cleanup job needs full access. Which key should it use? → The service role key, only in server-side code", "explain_task": "Explain the two keys in three lines.", "own_task": "Write where each key would live in a web app and a backend job.", "id": "SUP-005", "topic": "01 Basics", "level": "Intermediate", "type": "topic56"}, {"term": "Environment variables for Supabase", "cue": "Where should the project URL and keys live so they are not written directly in your source code?", "kind": "Configuration practice", "frequency": "Very high", "importance": "5", "origin": "Keys written in code spread through repositories and logs, so apps read them from environment variables that differ for each environment.", "pro_tip": "Prefix variables that must reach the browser as your framework requires, and keep server-only ones unprefixed.", "memory_story": "Environment variables are labelled drawers outside the code, and the code only asks for the drawer's name.", "visual": "A .env file beside the code, with arrows from names in the code to values in the file.", "emotion": "The calm of knowing a key is not hidden inside the code by accident.", "meaning": "Environment variables store the URL and keys outside the code, and the app reads them at run time.", "code": "// .env.local (not committed)\nNEXT_PUBLIC_SUPABASE_URL=https://abcd1234.supabase.co\nNEXT_PUBLIC_SUPABASE_ANON_KEY=your-client-key\nSUPABASE_SERVICE_ROLE_KEY=your-server-only-key\n// code\nconst url = process.env.NEXT_PUBLIC_SUPABASE_URL;", "output": "The app reads the URL from the environment, and the keys never appear in the committed code.", "explanation": "In Next.js, variables starting with NEXT_PUBLIC_ are sent to the browser, so only the URL and client key should have that prefix. The service role key has no prefix, so it stays on the server. Add the env file to .gitignore, and set the same variables in your hosting provider.", "simple_explain": "Put the URL and keys in an env file, ignore that file in git, and read them with process.env. Never prefix the service role key so it stays server-only.", "analogy": "It is like labelled drawers outside the code, and the code only asks for a drawer's name.", "syntax": "process.env.NAME", "anatomy": "NEXT_PUBLIC_ = sent to the browser | no prefix = server only | .env.local = local file ignored by git", "example_1": "const url = process.env.NEXT_PUBLIC_SUPABASE_URL;", "example_2": "const key = process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY;", "example_3": "const admin = process.env.SUPABASE_SERVICE_ROLE_KEY;", "variation": "Vite uses the VITE_ prefix for variables sent to the browser\nHosting dashboards let you add the same variables for production", "used_with": ".gitignore, createClient, deployment settings", "related": "Project URL and API keys, anon key vs service role key, secrets", "alternatives": "A secrets manager for larger teams", "where_used": "Every deployment | Local development | CI settings", "mini_conversation": "A: Should I paste the key into my code for now? | B: No, put it in an env file and read it with process.env.", "misconception": "✗ Anything in an env file is hidden from users → ✓ Variables with a public prefix are sent to the browser, so only non-secret values should have it", "confused_with": "Public prefix vs server-only variable: the prefixed one reaches the browser, the other stays on the server.", "avoid": "Do not give the service role key a public prefix.", "wrong_code": "NEXT_PUBLIC_SUPABASE_SERVICE_ROLE_KEY=your-server-only-key", "right_code": "SUPABASE_SERVICE_ROLE_KEY=your-server-only-key", "memory_trick": "Public prefix means public to everyone.", "real_project": "Setting the same variable names in the local file and the hosting dashboard.", "real_interview": "An interviewer may ask: How do you keep Supabase keys out of source code?", "real_daily": "It is like labelled drawers outside the code.", "mcq_question": "Which variable must not have a public prefix?", "mcq_options": "A) The service role key B) The project URL C) The client key D) The region name", "mcq_answer": "A", "mcq_why": "A public prefix sends the value to the browser, which would leak the service role key.", "fill_blank": "Add the env file to ____ so it is not committed → .gitignore", "hindi_to_task": "Read the Supabase URL from the environment variable NEXT_PUBLIC_SUPABASE_URL.", "task_answer": "const url = process.env.NEXT_PUBLIC_SUPABASE_URL;", "own_task": "Create an env file for a project and list which variables are public and which are not.", "practice_question": "What does the NEXT_PUBLIC_ prefix do in Next.js?", "practice_answer": "It makes the variable available in browser code.", "id": "SUP-006", "topic": "01 Basics", "level": "Beginner", "type": "code56"}, {"term": "Tables, rows and columns", "cue": "In a Supabase database, what do you call the grid that stores data in columns for each field and rows for each record?", "category": "Database concept", "frequency": "Very high", "importance": "5", "origin": "Relational databases organise data in tables because a grid of rows and columns is easy to search, sort and link to other tables.", "pro_tip": "Give each table a clear plural name, such as todos or profiles, and keep one kind of thing per table.", "memory_story": "A table is a spreadsheet where each column has a strict type and each row is one record.", "visual": "A grid with headers across the top and each line below holding one record.", "emotion": "The tidiness of seeing data in a neat grid.", "definition": "A table stores records as rows, and each column holds one kind of value for those records, such as a title or a date.", "explanation": "You can create tables in the Table Editor with clicks or in the SQL Editor with SQL. Each column has a name and a data type, and may have rules such as not null or a default value. Supabase shows the table through its API automatically.", "simple_explain": "A table is like a spreadsheet. Each column is a field such as title, and each row is one item, such as one to-do.", "analogy": "It is like a spreadsheet with strict column types.", "formula_rule": "Table = columns (fields) + rows (records)", "example_1": "A todos table with the columns id, title and done.", "example_2": "A profiles table with one row for each user.", "example_3": "A products table with name, price and stock columns.", "related": "data types, primary key, SQL Editor, Table Editor", "word_family": "table, row, column, record, field", "where_used": "Every Supabase app | Data modelling | Admin screens", "mini_conversation": "A: Where do I store my tasks? | B: Make a todos table with a title column and a done column.", "misconception": "✗ A table can hold any shape of data in any row → ✓ Every row follows the table's column structure and types", "contrast": "Row vs column: a row is one record, a column is one field across all records.", "avoid": "Do not put unrelated data into one giant table.", "memory_trick": "Columns are fields, rows are records.", "real_project": "Designing tables for students, lessons and progress in a learning app.", "real_interview": "An interviewer may ask: What is the difference between a row and a column?", "real_daily": "It is like a spreadsheet with strict column types.", "mcq_question": "What does one row in a table represent?", "mcq_options": "A) One record B) One field name C) One database D) One user key", "mcq_answer": "A", "mcq_why": "A row stores one complete record.", "fill_blank": "Each ____ in a table has a name and a data type → column", "apply": "How would you store tasks with a title and a done status? → Make a todos table with a title column and a done column", "explain_task": "Explain tables, rows and columns in three lines.", "own_task": "Sketch a table for a library with five columns.", "id": "SUP-007", "topic": "02 Database", "level": "Beginner", "type": "topic56"}, {"term": "Common Postgres data types", "cue": "Which types such as text, integer, boolean, timestamptz, uuid and jsonb decide what each column may hold?", "category": "Database concept", "frequency": "Very high", "importance": "4", "origin": "A database must know whether a column holds words, numbers or times so it can store them efficiently and compare them correctly.", "pro_tip": "Use timestamptz for times so they carry a timezone, and uuid for ids that must be hard to guess.", "memory_story": "Data types are the labelled shelves in a store, each built for one kind of goods.", "visual": "Shelves labelled text, number, date and true or false.", "emotion": "The relief of a database that rejects bad values early.", "definition": "A data type defines the kind of value a column accepts, such as text, whole numbers, true or false, dates with time zones, unique ids or JSON.", "explanation": "Common types are text for words, integer and bigint for whole numbers, numeric for exact decimals, boolean for true or false, timestamptz for date and time with timezone, uuid for unique identifiers, and jsonb for flexible JSON data. Choosing the right type enables sorting, maths and validation.", "simple_explain": "Pick a type for each column so Postgres knows what it holds. Words go in text, yes or no in boolean, and time in timestamptz.", "analogy": "Types are shelves in a store, each built for one kind of goods.", "formula_rule": "words = text, whole numbers = integer, yes or no = boolean, date and time = timestamptz, unique id = uuid, flexible data = jsonb", "example_1": "A title column of type text.", "example_2": "A created_at column of type timestamptz.", "example_3": "A settings column of type jsonb that stores a JSON object.", "related": "tables and columns, primary key, constraints", "word_family": "text, integer, boolean, timestamptz, uuid, jsonb", "where_used": "Creating tables | Validating data | Choosing ids", "mini_conversation": "A: Which type should I use for created time? | B: Use timestamptz so the time keeps its timezone.", "misconception": "✗ Storing every value as text is simpler and just as good → ✓ Proper types allow correct sorting, maths and validation, and save space", "contrast": "timestamp vs timestamptz: timestamptz keeps timezone information, plain timestamp does not.", "avoid": "Do not store dates as text.", "memory_trick": "Pick the type that fits the value.", "real_project": "Using uuid for user ids, timestamptz for times and jsonb for flexible settings.", "real_interview": "An interviewer may ask: When would you use jsonb in Postgres?", "real_daily": "It is like shelves in a store, each built for one kind of goods.", "mcq_question": "Which type is best for a yes or no column?", "mcq_options": "A) boolean B) text C) uuid D) jsonb", "mcq_answer": "A", "mcq_why": "boolean stores true or false.", "fill_blank": "A column holding unique identifiers often uses the ____ type → uuid", "apply": "Which type fits a date and time with timezone? → timestamptz", "explain_task": "Explain data types in three lines.", "own_task": "Choose a type for each column of a table for events.", "id": "SUP-008", "topic": "02 Database", "level": "Beginner", "type": "topic56"}, {"term": "Primary key and foreign key", "cue": "Which column uniquely identifies each row, and which column points to a row in another table?", "category": "Database concept", "frequency": "Very high", "importance": "5", "origin": "Rows need unique identities and tables need reliable links, so relational databases use primary keys to identify rows and foreign keys to connect them.", "pro_tip": "Give every table a primary key, and add a foreign key wherever one table refers to another.", "memory_story": "A primary key is a person's national ID number, and a foreign key is that number written on another form to refer to them.", "visual": "One table with an id column and another with a column linking back to it by a line.", "emotion": "The confidence of data that cannot point to something missing.", "definition": "A primary key is a column whose value uniquely identifies each row, and a foreign key is a column that refers to the primary key of another table.", "explanation": "A primary key must be unique and not null. A foreign key enforces that the referenced row exists, so you cannot add a todo for a user that is not in the table. You can choose what happens on delete, such as cascade, which removes dependent rows, or restrict.", "simple_explain": "The primary key names each row. A foreign key says which row of another table this one belongs to, and the database keeps that link valid.", "analogy": "A primary key is a national ID number, and a foreign key is that number written on another form.", "formula_rule": "todos.user_id (foreign key) → profiles.id (primary key)", "example_1": "profiles.id as the primary key of the profiles table.", "example_2": "todos.user_id referencing profiles.id.", "example_3": "A foreign key with on delete cascade that removes a user's todos when the user is deleted.", "related": "tables and columns, joins, constraints, Auth users", "word_family": "primary key, foreign key, reference, cascade, constraint", "where_used": "Data modelling | Joins | Integrity rules", "mini_conversation": "A: Can a todo exist for a user that does not exist? | B: Not with a foreign key, since the database checks the user exists.", "misconception": "✗ A foreign key only labels the relationship and does not enforce it → ✓ A foreign key makes the database reject rows that refer to a missing row", "contrast": "Primary vs foreign key: the primary key identifies a row, the foreign key refers to another table's row.", "avoid": "Do not leave out foreign keys when tables are clearly related.", "memory_trick": "A primary key identifies and a foreign key refers.", "real_project": "Linking each lesson row to its course through a foreign key.", "real_interview": "An interviewer may ask: What happens if you delete a row that other rows reference?", "real_daily": "It is like an ID number written on another form to refer to a person.", "mcq_question": "Which key refers to a row in another table?", "mcq_options": "A) Foreign key B) Primary key C) Service key D) Anon key", "mcq_answer": "A", "mcq_why": "A foreign key points to the primary key of another table.", "fill_blank": "A column that uniquely identifies each row is the ____ key → primary", "apply": "How do you stop todos from pointing to missing users? → Add a foreign key to the users or profiles table", "explain_task": "Explain primary and foreign keys in three lines.", "own_task": "Design the keys for tables of courses and lessons.", "id": "SUP-009", "topic": "02 Database", "level": "Beginner", "type": "topic56"}, {"term": "SQL Editor (create table)", "cue": "Which dashboard tool lets you run SQL, such as a statement that creates a new table with its columns?", "kind": "Dashboard tool", "frequency": "Very high", "importance": "5", "origin": "Clicking through a form is slow for repeatable work, so the dashboard includes an editor where you can run SQL directly against your database.", "pro_tip": "Save useful queries in the SQL Editor, and move important changes into migration files.", "memory_story": "The SQL Editor is the workshop bench where you speak to the database in its own language.", "visual": "A code panel with a query on top and a result grid beneath it.", "emotion": "The satisfaction of a table appearing after one statement.", "meaning": "The SQL Editor runs SQL statements against your project's database, such as create table, insert and select.", "code": "create table todos (\n  id bigint generated always as identity primary key,\n  title text not null,\n  done boolean default false,\n  created_at timestamptz default now()\n);", "output": "Success. No rows returned, and the todos table now appears in the Table Editor.", "explanation": "Each column has a name, a type and optional rules such as primary key, not null and default. Identity columns generate numbers automatically, and now() fills in the current time. After running it, the table is available through the API, though you should enable Row Level Security before using it from a browser.", "simple_explain": "Write the create table statement, run it, and the table exists. List each column with its type and any rules.", "analogy": "It is like a workshop bench where you speak to the database in its own language.", "syntax": "create table name (column type rules, ...);", "anatomy": "create table = make a table | column type = each field | primary key, not null, default = rules", "example_1": "create table todos (id bigint generated always as identity primary key, title text not null);", "example_2": "create table profiles (id uuid primary key, full_name text);", "example_3": "alter table todos add column due_date date;", "variation": "insert into todos (title) values ('Buy milk');   // add a row\nselect * from todos;   // read rows", "used_with": "Table Editor, migrations, RLS, data types", "related": "tables and columns, data types, migrations", "alternatives": "The Table Editor with clicks", "where_used": "Setting up tables | Quick experiments | Learning SQL", "mini_conversation": "A: How do I create the todos table quickly? | B: Open the SQL Editor and run a create table statement.", "misconception": "✗ A table made in the SQL Editor is automatically protected by Row Level Security → ✓ Tables created with SQL do not have RLS enabled by default, so you must enable it yourself", "confused_with": "SQL Editor vs Table Editor: the SQL Editor runs statements, the Table Editor is a spreadsheet-like view of the data.", "avoid": "Do not leave a new table without RLS if the browser will access it.", "wrong_code": "create todos (id, title);", "right_code": "create table todos (id bigint generated always as identity primary key, title text not null);", "memory_trick": "create table, then name, then columns.", "real_project": "Creating the base tables of a new app in the SQL Editor and saving them as migrations.", "real_interview": "An interviewer may ask: How would you create a table in Supabase?", "real_daily": "It is like speaking to the database at a workshop bench.", "mcq_question": "Which statement creates a new table?", "mcq_options": "A) create table B) select table C) open table D) new rows", "mcq_answer": "A", "mcq_why": "create table defines a new table.", "fill_blank": "create ____ todos (id bigint primary key); → table", "hindi_to_task": "Add a due_date column of type date to the todos table.", "task_answer": "alter table todos add column due_date date;", "own_task": "Create a table for notes with a title and a body.", "practice_question": "What does default now() do for a created_at column?", "practice_answer": "It fills in the current time when a row is inserted.", "id": "SUP-010", "topic": "02 Database", "level": "Beginner", "type": "code56"}, {"term": "Joins and relationships in queries", "cue": "How do you read related data from two tables in one query, such as each todo with its owner's name?", "kind": "SQL concept", "frequency": "Very high", "importance": "5", "origin": "Related data lives in separate tables to avoid repetition, so queries need a way to bring matching rows together.", "pro_tip": "In supabase-js you can pull related rows by naming the related table inside select, if a foreign key links them.", "memory_story": "A join matches rows from two tables like pairing forms by ID number.", "visual": "Two tables with lines joining matching ids and a combined result below.", "emotion": "The pleasure of seeing names beside their records.", "meaning": "A join combines rows from two tables by matching a column, usually a foreign key to a primary key.", "code": "select todos.title, profiles.full_name\nfrom todos\njoin profiles on profiles.id = todos.user_id;", "output": "A result with each todo title next to the full name of its owner.", "explanation": "join returns only rows that match in both tables, and left join keeps all rows from the first table. With a foreign key in place, the Supabase API lets you request related data without writing SQL, by listing the related table in select.", "simple_explain": "Tell the database which columns match, and it pairs the rows. Then you can pick columns from both tables.", "analogy": "It is like pairing forms by their ID numbers.", "syntax": "select ... from a join b on a.col = b.col", "anatomy": "join = combine tables | on = the matching condition | left join = keep all rows from the first table", "example_1": "select todos.title, profiles.full_name from todos join profiles on profiles.id = todos.user_id;", "example_2": "select * from todos left join profiles on profiles.id = todos.user_id;", "example_3": "await supabase.from(\"todos\").select(\"title, profiles(full_name)\");", "variation": "left join   // keep todos without a matching profile\nselect title, profiles(full_name)   // the supabase-js form of a join", "used_with": "foreign keys, select, supabase-js", "related": "primary and foreign key, REST API, select", "alternatives": "Two separate queries combined in code", "where_used": "Lists with owner names | Reports | Detail pages", "mini_conversation": "A: I need each todo with its owner's name. | B: Join todos to profiles on the user id, or select the related table in supabase-js.", "misconception": "✗ A join copies the data into a new permanent table → ✓ A join only combines rows in the result of a query and stores nothing new", "confused_with": "join vs left join: join keeps only matches, left join keeps all rows from the first table.", "avoid": "Do not forget the on condition, or you get every combination of rows.", "wrong_code": "select title, full_name from todos join profiles;", "right_code": "select todos.title, profiles.full_name from todos join profiles on profiles.id = todos.user_id;", "memory_trick": "A join needs an on condition.", "real_project": "Showing each lesson with its course name in a list.", "real_interview": "An interviewer may ask: What is the difference between an inner join and a left join?", "real_daily": "It is like pairing forms by their ID numbers.", "mcq_question": "Which keyword states how the two tables match in a join?", "mcq_options": "A) on B) where only C) group D) limit", "mcq_answer": "A", "mcq_why": "The on clause gives the matching condition.", "fill_blank": "select * from todos left ____ profiles on profiles.id = todos.user_id; → join", "hindi_to_task": "Select todo titles together with the profile full names using supabase-js.", "task_answer": "await supabase.from(\"todos\").select(\"title, profiles(full_name)\");", "own_task": "Write a query that lists each lesson with its course title.", "practice_question": "What does a left join keep that a plain join does not?", "practice_answer": "Rows from the first table that have no match in the second.", "id": "SUP-011", "topic": "02 Database", "level": "Intermediate", "type": "code56"}, {"term": "Indexes", "cue": "Which database structure speeds up lookups on a column so queries do not scan the whole table?", "kind": "SQL concept", "frequency": "High", "importance": "4", "origin": "Scanning every row to find matches gets slow as tables grow, so databases keep a sorted structure that lets them jump straight to the right rows.", "pro_tip": "Index the columns you filter or join on often, such as foreign keys and user ids used in policies.", "memory_story": "An index is the index at the back of a book that lets you jump to a page instead of reading every page.", "visual": "A sorted list of values pointing to row locations.", "emotion": "The thrill of a slow query becoming instant.", "meaning": "An index is a data structure on one or more columns that lets Postgres find rows quickly without reading the entire table.", "code": "create index todos_user_id_idx on todos (user_id);", "output": "Index created, and queries that filter by user_id become much faster on large tables.", "explanation": "Postgres automatically indexes primary keys and unique constraints, but not foreign key columns. Indexes make reads faster and writes slightly slower, and they take space, so add them where queries need them. Row Level Security policies that check user_id also benefit from an index on that column.", "simple_explain": "Add an index on a column you search or join by. Reads get faster, and the cost is a little extra work on writes.", "analogy": "It is like the index at the back of a book that lets you jump to a page.", "syntax": "create index name on table (column);", "anatomy": "create index = make an index | name = index name | table (column) = what it covers", "example_1": "create index todos_user_id_idx on todos (user_id);", "example_2": "create index lessons_course_id_idx on lessons (course_id);", "example_3": "create unique index profiles_email_idx on profiles (email);", "variation": "create index on todos (user_id, created_at);   // multi-column index\ndrop index todos_user_id_idx;   // remove one", "used_with": "foreign keys, RLS policies, EXPLAIN", "related": "performance, EXPLAIN, Row Level Security", "alternatives": "Rewriting the query to need less data", "where_used": "Large tables | Slow queries | RLS-heavy tables", "mini_conversation": "A: Fetching a user's todos is slow now. | B: Add an index on the user_id column.", "misconception": "✗ Postgres automatically indexes every foreign key column → ✓ Primary keys and unique constraints are indexed, but foreign key columns usually need an index you create", "confused_with": "Primary key vs index: a primary key is a rule that also creates an index, an index alone only speeds up lookups.", "avoid": "Do not add indexes to every column.", "wrong_code": "create index on todos;", "right_code": "create index todos_user_id_idx on todos (user_id);", "memory_trick": "Index the columns you search by.", "real_project": "Adding an index on user_id so policy checks stay fast on a large table.", "real_interview": "An interviewer may ask: When is an index useful and when does it hurt?", "real_daily": "It is like the index at the back of a book.", "mcq_question": "What is the main benefit of an index?", "mcq_options": "A) Faster lookups B) Smaller tables C) Stronger passwords D) More columns", "mcq_answer": "A", "mcq_why": "An index lets the database find rows without scanning everything.", "fill_blank": "create ____ todos_user_id_idx on todos (user_id); → index", "hindi_to_task": "Create an index on the course_id column of lessons.", "task_answer": "create index lessons_course_id_idx on lessons (course_id);", "own_task": "Choose two columns of your tables that deserve an index and say why.", "practice_question": "Which columns does Postgres index automatically?", "practice_answer": "Primary keys and columns with unique constraints.", "id": "SUP-012", "topic": "02 Database", "level": "Intermediate", "type": "code56"}, {"term": "Views", "cue": "Which database object is a saved query that you can read from like a table?", "kind": "SQL concept", "frequency": "Medium", "importance": "3", "origin": "Complex queries are used again and again, so databases let you save a query under a name and treat the result as a virtual table.", "pro_tip": "Create views with security_invoker on, so Row Level Security of the underlying tables still applies to the caller.", "memory_story": "A view is a window cut into your tables that always shows the latest result of a saved question.", "visual": "A table-like frame showing rows that come from a stored query.", "emotion": "The convenience of a saved question you can ask again.", "meaning": "A view is a saved query that behaves like a read-only table and is recalculated whenever you read from it.", "code": "create view open_todos with (security_invoker = true) as\nselect id, title, user_id\nfrom todos\nwhere done = false;", "output": "A view called open_todos that lists only the todos that are not done.", "explanation": "A view stores no data of its own, only the query. By default a Postgres view runs with the permissions of its owner, so it can bypass Row Level Security of the tables it reads from. Setting security_invoker to true, available in recent Postgres versions, makes it run with the caller's permissions so the policies still apply.", "simple_explain": "A view is a saved query with a name. Read from it like a table, and make it security invoker so your RLS rules are not skipped.", "analogy": "It is like a window cut into your tables that always shows the latest result of a saved question.", "syntax": "create view name as select ...;", "anatomy": "create view = save the query | with (security_invoker = true) = use the caller's rights | as select = the query", "example_1": "create view open_todos as select * from todos where done = false;", "example_2": "select * from open_todos;", "example_3": "create view course_summary as select course_id, count(*) as lessons from lessons group by course_id;", "variation": "create or replace view ...   // change an existing view\ndrop view open_todos;   // remove it", "used_with": "security_invoker, RLS, joins", "related": "tables, Row Level Security, joins", "alternatives": "A materialized view that stores the result", "where_used": "Reports | Simplifying queries | Exposing a limited set of columns", "mini_conversation": "A: My view shows rows that RLS should hide. | B: Views run as their owner by default, so turn on security invoker.", "misconception": "✗ A view always respects the Row Level Security of its tables → ✓ By default a view runs with its owner's rights and can bypass RLS unless security_invoker is on", "confused_with": "View vs table: a view stores a query, a table stores data.", "avoid": "Do not expose a view to the API without checking whether it bypasses RLS.", "wrong_code": "create view open_todos as select * from todos where done = false;", "right_code": "create view open_todos with (security_invoker = true) as select * from todos where done = false;", "memory_trick": "Views need security invoker to respect RLS.", "real_project": "Exposing a read-only summary view of lesson counts, with security invoker on.", "real_interview": "An interviewer may ask: Can a view bypass Row Level Security?", "real_daily": "It is like a window onto a saved question.", "mcq_question": "What does a view store?", "mcq_options": "A) A saved query B) A copy of all rows C) A password D) A file", "mcq_answer": "A", "mcq_why": "A view stores only the query, and the rows are produced when you read it.", "fill_blank": "Setting security_____ to true makes a view use the caller's rights → invoker", "hindi_to_task": "Create a view of the todos that are done.", "task_answer": "create view done_todos with (security_invoker = true) as select * from todos where done = true;", "own_task": "Write a view that shows each course with its lesson count.", "practice_question": "Why can a default view bypass RLS?", "practice_answer": "Because it runs with the permissions of the view's owner.", "id": "SUP-013", "topic": "02 Database", "level": "Intermediate", "type": "code56"}, {"term": "Migrations and the Supabase CLI", "cue": "How do you track and replay database changes as files so every environment gets the same structure?", "kind": "Workflow", "frequency": "High", "importance": "5", "origin": "Changing a production database by hand is risky and untraceable, so teams keep every schema change as a versioned file that can be applied in order anywhere.", "pro_tip": "Commit migration files to git, and apply them to each environment instead of editing tables by hand in production.", "memory_story": "Migrations are recipe cards for building the database, applied in order on any kitchen.", "visual": "A folder of dated SQL files applied one after another.", "emotion": "The confidence of reproducing your database anywhere.", "meaning": "A migration is a versioned SQL file describing a schema change, and the Supabase CLI creates, tracks and applies them.", "code": "supabase migration new create_todos\n# edit supabase/migrations/<timestamp>_create_todos.sql\nsupabase db push", "output": "A new SQL file is created in supabase/migrations, and db push applies unapplied migrations to the linked project.", "explanation": "The CLI keeps migration files in the supabase/migrations folder with timestamps. supabase db diff can generate a migration from changes made in the local database. supabase db push applies pending migrations to the linked remote project. Keeping migrations in git gives you history and repeatable setups.", "simple_explain": "Write each change as a SQL file, commit it, and push it to the project with the CLI. Every environment then has the same structure.", "analogy": "It is like recipe cards for building the database, applied in order in any kitchen.", "syntax": "supabase migration new <name>  |  supabase db push", "anatomy": "migration new = create a file | db push = apply to the remote | db diff = generate a migration from changes", "example_1": "supabase migration new add_due_date_to_todos", "example_2": "supabase db diff -f add_profiles", "example_3": "supabase db push", "variation": "supabase db reset   // rebuild the local database from migrations\nsupabase link   // connect the CLI to a project", "used_with": "git, local development, SQL Editor", "related": "SQL Editor, local development, environments", "alternatives": "Prisma Migrate or another migration tool", "where_used": "Team projects | Production changes | Reproducible environments", "mini_conversation": "A: How do I apply the same table changes to production? | B: Put them in a migration file and run supabase db push.", "misconception": "✗ Editing tables by hand in the dashboard is just as safe as migrations → ✓ Manual edits are not recorded, so environments drift apart, and migrations keep changes repeatable", "confused_with": "Migration vs SQL Editor query: a migration is a saved, ordered change, an editor query is a one-off.", "avoid": "Do not edit applied migration files, add a new one instead.", "wrong_code": "supabase push migration", "right_code": "supabase db push", "memory_trick": "Every change gets its own file.", "real_project": "Storing every table change as a migration and applying it to staging and production.", "real_interview": "An interviewer may ask: How do you keep database schemas in sync across environments?", "real_daily": "It is like recipe cards applied in order.", "mcq_question": "Where are Supabase migration files kept?", "mcq_options": "A) supabase/migrations B) node_modules C) public D) .git/HEAD", "mcq_answer": "A", "mcq_why": "The CLI stores migration SQL files in supabase/migrations.", "fill_blank": "supabase db ____ applies pending migrations to the remote project → push", "hindi_to_task": "Create a new migration called add_notes_table.", "task_answer": "supabase migration new add_notes_table", "own_task": "Write the commands to create a migration and apply it to your project.", "practice_question": "Which command generates a migration from changes made in the local database?", "practice_answer": "supabase db diff", "id": "SUP-014", "topic": "02 Database", "level": "Intermediate", "type": "code56"}, {"term": "Auto-generated REST API (PostgREST)", "cue": "Which Supabase component turns your tables into ready-to-use HTTP endpoints without any backend code?", "category": "API concept", "frequency": "Very high", "importance": "5", "origin": "Writing endpoints for every table is repetitive, so Supabase uses PostgREST to build a REST API directly from the database structure.", "pro_tip": "Use the client library for normal work, and remember the same API can be called with plain HTTP when needed.", "memory_story": "PostgREST is a translator that turns every table into an address you can call over the web.", "visual": "A table on one side and a matching URL path with GET and POST arrows on the other.", "emotion": "The delight of an API appearing the moment a table exists.", "definition": "PostgREST is the service that automatically exposes your Postgres tables and views as a REST API, with access controlled by database roles and Row Level Security.", "explanation": "A table named todos becomes available at a path such as /rest/v1/todos. GET reads rows, POST inserts, PATCH updates and DELETE removes, and query parameters filter and sort. Requests are made as a database role, so RLS policies decide which rows are visible. The supabase-js library builds these calls for you.", "simple_explain": "Make a table and the API exists. You read and write it with normal HTTP calls or with supabase-js, and the database rules decide who can see what.", "analogy": "It is like a translator that turns every table into a web address.", "formula_rule": "Table → /rest/v1/table_name → GET, POST, PATCH, DELETE", "example_1": "GET /rest/v1/todos returns the rows of the todos table.", "example_2": "POST /rest/v1/todos with a JSON body inserts a row.", "example_3": "GET /rest/v1/todos?done=eq.false filters the rows.", "related": "supabase-js, Row Level Security, REST, filters", "word_family": "PostgREST, REST, endpoint, role, schema", "where_used": "Every Supabase app | Quick prototypes | Mobile and web clients", "mini_conversation": "A: Do I need to write endpoints for my tables? | B: No, Supabase generates the REST API from your tables automatically.", "misconception": "✗ The auto API is open to everyone once a table exists → ✓ Access is controlled by database roles and Row Level Security, so enable RLS on exposed tables", "contrast": "PostgREST vs a custom backend: PostgREST exposes tables with rules in the database, a custom backend codes every endpoint.", "avoid": "Do not expose a table to the API without RLS.", "memory_trick": "A table becomes an endpoint.", "real_project": "Reading and writing tasks from a web app with no custom server code.", "real_interview": "An interviewer may ask: How does Supabase provide an API for your tables?", "real_daily": "It is like a translator turning tables into web addresses.", "mcq_question": "What makes the REST API of a Supabase project?", "mcq_options": "A) PostgREST B) CSS C) Docker only D) Excel", "mcq_answer": "A", "mcq_why": "PostgREST generates the REST API from your Postgres schema.", "fill_blank": "A GET request on a table's endpoint ____ its rows → reads", "apply": "How do you stop strangers reading a table through the API? → Enable Row Level Security with suitable policies", "explain_task": "Explain the automatic REST API in three lines.", "own_task": "Write the HTTP calls you would use to list and create tasks.", "id": "SUP-015", "topic": "03 API and client", "level": "Beginner", "type": "topic56"}, {"term": "createClient (supabase-js setup)", "cue": "Which function from the supabase-js library gives your code a connection object to talk to a project?", "kind": "JavaScript function", "frequency": "Very high", "importance": "5", "origin": "Your code needs one reusable object that knows the project URL and key, so the library offers createClient to build it.", "pro_tip": "Create the client once in a small module and import it wherever you need it.", "memory_story": "createClient is plugging your app into the project with one cable carrying the address and the pass.", "visual": "A code file creating one object that other files import.", "emotion": "The satisfaction of the very first query working.", "meaning": "createClient builds a Supabase client from the project URL and key, which you use to call the database, auth, storage and functions.", "code": "import { createClient } from \"@supabase/supabase-js\";\nconst supabase = createClient(\n  process.env.NEXT_PUBLIC_SUPABASE_URL,\n  process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY\n);\nexport default supabase;", "output": "A client object named supabase that your code uses for every Supabase call.", "explanation": "Install the package with npm install @supabase/supabase-js. The client reads the URL and client key, and exposes helpers such as from for tables, auth for login, storage for files and rpc for functions. Server code that needs the service role key should use a separate client, created only on the server.", "simple_explain": "Install the library, call createClient with your URL and key, and keep the result in one module. Then use it for every call.", "analogy": "It is like plugging your app into the project with one cable that carries the address and the pass.", "syntax": "createClient(supabaseUrl, supabaseKey)", "anatomy": "createClient = make the client | supabaseUrl = project address | supabaseKey = client key", "example_1": "const supabase = createClient(url, anonKey);", "example_2": "const admin = createClient(url, process.env.SUPABASE_SERVICE_ROLE_KEY);", "example_3": "import supabase from \"./lib/supabase\";", "variation": "createBrowserClient and createServerClient from @supabase/ssr   // for frameworks with server rendering", "used_with": "environment variables, auth, from, rpc", "related": "project URL and keys, environment variables, server-side auth", "alternatives": "Calling the REST API directly with fetch", "where_used": "Every JavaScript app on Supabase | Server and browser code | Scripts", "mini_conversation": "A: How do I connect my app to Supabase? | B: Install supabase-js and call createClient with the URL and key.", "misconception": "✗ I should create a new client for every single query → ✓ Create the client once and reuse it, except for separate server-side admin clients", "confused_with": "Browser client vs admin client: the browser client uses the anon key, the admin client uses the service role key on a server.", "avoid": "Do not create a client with the service role key in browser code.", "wrong_code": "const supabase = createClient(process.env.SUPABASE_SERVICE_ROLE_KEY);", "right_code": "const supabase = createClient(process.env.NEXT_PUBLIC_SUPABASE_URL, process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY);", "memory_trick": "One client, created once, reused everywhere.", "real_project": "Keeping the client in a single file that all components import.", "real_interview": "An interviewer may ask: How do you initialise supabase-js?", "real_daily": "It is like plugging your app in with one cable.", "mcq_question": "Which two things does createClient need?", "mcq_options": "A) The project URL and a key B) A table name and a row C) A username and a file D) A region and a bucket", "mcq_answer": "A", "mcq_why": "The client needs to know which project and how to authenticate.", "fill_blank": "The function that builds the client object is called ____ → createClient", "hindi_to_task": "Create a client from the URL and the anon key variables.", "task_answer": "const supabase = createClient(process.env.NEXT_PUBLIC_SUPABASE_URL, process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY);", "own_task": "Write a small module that exports the client.", "practice_question": "Which package contains createClient?", "practice_answer": "@supabase/supabase-js", "id": "SUP-016", "topic": "03 API and client", "level": "Beginner", "type": "code56"}, {"term": "select (reading rows)", "cue": "Which supabase-js call reads rows from a table, and what does it return?", "kind": "JavaScript method", "frequency": "Very high", "importance": "5", "origin": "Reading data is the most common job of an app, so the client wraps the REST API in a readable chain starting with from and select.", "pro_tip": "Choose only the columns you need in select, instead of asking for everything.", "memory_story": "select is asking the shop assistant to bring only the items you name.", "visual": "A call chain from a table name to a result holding rows and an error slot.", "emotion": "The thrill of seeing your own rows appear in the console.", "meaning": "from(table).select(columns) reads rows and resolves to an object with data and error.", "code": "const { data, error } = await supabase\n  .from(\"todos\")\n  .select(\"id, title\")\n  .limit(10);\nif (error) throw error;\nconsole.log(data);", "output": "An array such as [{ id: 1, title: \"Buy milk\" }, { id: 2, title: \"Study\" }].", "explanation": "supabase-js does not throw when a query fails, it returns an error object, so you must check error. Without a filter, select returns all rows the policies allow, up to a server limit. You list columns as a string, and can include related tables such as profiles(full_name).", "simple_explain": "Call from with the table name and select with the columns. You get back data and error, so always check the error before using the data.", "analogy": "It is like asking the shop assistant to bring only the items you name.", "syntax": "await supabase.from(\"table\").select(\"col1, col2\")", "anatomy": "from = which table | select = which columns | data = the rows | error = the problem, if any", "example_1": "await supabase.from(\"todos\").select(\"*\");", "example_2": "await supabase.from(\"todos\").select(\"id, title\");", "example_3": "await supabase.from(\"todos\").select(\"id, title, done\");", "variation": ".single()   // expect exactly one row\n.limit(10)   // at most ten rows", "used_with": "limit, filters, order, error handling", "related": "filters and ordering, createClient, joins", "alternatives": "A GET request to the REST API", "where_used": "Lists | Detail pages | Dashboards", "mini_conversation": "A: My list is undefined. | B: You must destructure data and check error, since the call returns an object with both.", "misconception": "✗ supabase-js throws an error when a query fails → ✓ It returns an error object, so you must check error yourself", "confused_with": "data vs error: data holds the rows on success, error holds the problem on failure.", "avoid": "Do not use the data before checking error.", "wrong_code": "const todos = await supabase.from(\"todos\").select(\"*\");", "right_code": "const { data: todos, error } = await supabase.from(\"todos\").select(\"*\");", "memory_trick": "Always check error before using data.", "real_project": "Listing a user's lessons and showing a message if error is set.", "real_interview": "An interviewer may ask: How does supabase-js report errors?", "real_daily": "It is like asking an assistant to bring only the items you name.", "mcq_question": "What does select return in supabase-js?", "mcq_options": "A) An object with data and error B) A string C) Only an array D) A boolean", "mcq_answer": "A", "mcq_why": "The result is an object holding data and error.", "fill_blank": "const { data, ____ } = await supabase.from(\"todos\").select(\"*\"); → error", "hindi_to_task": "Read the title column of all todos.", "task_answer": "const { data, error } = await supabase.from(\"todos\").select(\"title\");", "own_task": "Write a query that reads the name and price of products.", "practice_question": "What does .single() expect from a query?", "practice_answer": "Exactly one row.", "id": "SUP-017", "topic": "03 API and client", "level": "Beginner", "type": "code56"}, {"term": "insert (adding rows)", "cue": "Which supabase-js call adds a new row to a table, and how do you get the created row back?", "kind": "JavaScript method", "frequency": "Very high", "importance": "5", "origin": "Apps constantly create records, so the client offers an insert method that sends a POST to the table's endpoint.", "pro_tip": "Chain select after insert when you need the new row, including its generated id.", "memory_story": "Insert is dropping a new card into the filing box, and select asks for a copy of the card back.", "visual": "An object flying into a table and a copy of the new row returning.", "emotion": "The satisfaction of watching a record appear in the dashboard.", "meaning": "from(table).insert(values) adds one or more rows, and chaining select returns the created rows.", "code": "const { data, error } = await supabase\n  .from(\"todos\")\n  .insert({ title: \"Buy milk\" })\n  .select();\nif (error) throw error;\nconsole.log(data[0].id);", "output": "The id generated for the new row, such as 3.", "explanation": "insert accepts one object or an array of objects. In the current library versions it does not return the created rows unless you add select. Columns with defaults, such as ids and timestamps, are filled by the database. The insert must satisfy Row Level Security policies and table constraints.", "simple_explain": "Pass an object with the column values to insert. Add select to get the new row back with its generated id.", "analogy": "It is like dropping a new card into a filing box and asking for a copy back.", "syntax": "await supabase.from(\"table\").insert(values).select()", "anatomy": "insert = add rows | values = an object or array of objects | select = return the created rows", "example_1": "await supabase.from(\"todos\").insert({ title: \"Buy milk\" });", "example_2": "await supabase.from(\"todos\").insert([{ title: \"A\" }, { title: \"B\" }]);", "example_3": "const { data } = await supabase.from(\"todos\").insert({ title: \"Study\" }).select();", "variation": ".upsert({ id: 1, title: \"New\" })   // insert or update if the id exists", "used_with": "select, RLS policies, constraints, error handling", "related": "select, update and delete, Row Level Security", "alternatives": "A POST request to the REST API", "where_used": "Forms | Creating records | Bulk imports", "mini_conversation": "A: I inserted a row but data is empty. | B: Add select after insert to get the new row back.", "misconception": "✗ insert always returns the new row → ✓ Without select, insert returns no rows, so chain select when you need them", "confused_with": "insert vs upsert: insert always adds, upsert adds or updates when the key exists.", "avoid": "Do not ignore errors, since a policy may block the insert.", "wrong_code": "const { data } = await supabase.from(\"todos\").insert({ title: \"Buy milk\" });", "right_code": "const { data } = await supabase.from(\"todos\").insert({ title: \"Buy milk\" }).select();", "memory_trick": "Insert adds the row, select returns it.", "real_project": "Creating a new lesson and showing it immediately using the returned row.", "real_interview": "An interviewer may ask: How do you insert several rows at once?", "real_daily": "It is like dropping a card in a filing box and asking for a copy back.", "mcq_question": "How do you get the inserted row back?", "mcq_options": "A) Chain select after insert B) Call delete C) Use limit D) Use rpc", "mcq_answer": "A", "mcq_why": "select after insert returns the created rows.", "fill_blank": "await supabase.from(\"todos\").____({ title: \"Buy milk\" }); → insert", "hindi_to_task": "Insert two todos titled A and B in one call.", "task_answer": "await supabase.from(\"todos\").insert([{ title: \"A\" }, { title: \"B\" }]);", "own_task": "Write an insert for a note and read back its id.", "practice_question": "What does upsert do?", "practice_answer": "It inserts a row, or updates it if the key already exists.", "id": "SUP-018", "topic": "03 API and client", "level": "Beginner", "type": "code56"}, {"term": "update and delete", "cue": "Which supabase-js calls change or remove existing rows, and why must you add a filter to them?", "kind": "JavaScript method", "frequency": "Very high", "importance": "5", "origin": "Records change and disappear, so the client offers update and delete, which act on whichever rows match the filter you attach.", "pro_tip": "Always add a filter such as eq(\"id\", value), or the call can affect every row that your policies allow.", "memory_story": "Update and delete are a pen and an eraser, and the filter is your finger pointing at which line to use them on.", "visual": "A pointer selecting one row before a change is applied.", "emotion": "The care of double-checking the filter before pressing run.", "meaning": "update changes values in rows that match a filter, and delete removes rows that match a filter.", "code": "await supabase.from(\"todos\").update({ done: true }).eq(\"id\", 1);\nawait supabase.from(\"todos\").delete().eq(\"id\", 1);", "output": "The todo with id 1 is marked done, and then it is removed from the table.", "explanation": "Both methods need filters such as eq to pick the rows. Without a filter, the change could apply to many rows, and some setups reject it for safety. Row Level Security still applies, so a policy may block the change, and you will see zero affected rows or an error. Chain select to read the changed rows.", "simple_explain": "Say what to change, then say which row. Without the filter you may touch far more than you meant.", "analogy": "Update and delete are a pen and an eraser, and the filter is your finger pointing at the line.", "syntax": "await supabase.from(\"table\").update(values).eq(\"col\", value)", "anatomy": "update(values) = new values | delete() = remove | eq = which rows", "example_1": "await supabase.from(\"todos\").update({ title: \"New\" }).eq(\"id\", 5);", "example_2": "await supabase.from(\"todos\").delete().eq(\"id\", 5);", "example_3": "await supabase.from(\"todos\").delete().in(\"id\", [1, 2, 3]);", "variation": ".update({ done: true }).eq(\"user_id\", userId).select()   // return the changed rows", "used_with": "eq, in, RLS policies, select", "related": "filters, Row Level Security, insert", "alternatives": "A PATCH or DELETE request to the REST API", "where_used": "Editing records | Removing records | Clean-up jobs", "mini_conversation": "A: I deleted without a filter and lost many rows. | B: Always add a filter like eq on the id before running delete.", "misconception": "✗ update and delete affect only one row by default → ✓ They affect every row that matches the filter, so a missing filter can change many rows", "confused_with": "update vs insert: update changes existing rows, insert adds new ones.", "avoid": "Never run delete without checking the filter.", "wrong_code": "await supabase.from(\"todos\").delete();", "right_code": "await supabase.from(\"todos\").delete().eq(\"id\", 1);", "memory_trick": "No filter, no safe delete.", "real_project": "Marking a single task done with update and eq on its id.", "real_interview": "An interviewer may ask: What happens if you call delete without a filter?", "real_daily": "It is like a pen and an eraser pointed at one line.", "mcq_question": "Which method picks the rows to change?", "mcq_options": "A) eq B) from C) insert D) createClient", "mcq_answer": "A", "mcq_why": "eq filters rows by a column value.", "fill_blank": "await supabase.from(\"todos\").update({ done: true }).____(\"id\", 1); → eq", "hindi_to_task": "Delete the todo whose id is 7.", "task_answer": "await supabase.from(\"todos\").delete().eq(\"id\", 7);", "own_task": "Write an update that renames a note with a given id.", "practice_question": "Which filter method matches a list of values?", "practice_answer": "in", "id": "SUP-019", "topic": "03 API and client", "level": "Beginner", "type": "code56"}, {"term": "Filters, ordering and pagination", "cue": "Which chained methods let you pick matching rows, sort them, and read them a page at a time?", "kind": "JavaScript method", "frequency": "Very high", "importance": "5", "origin": "Real lists need narrowing, sorting and paging, so the client offers filter methods that turn into query parameters on the REST API.", "pro_tip": "Use range for pagination, and order by a stable column such as created_at so pages do not shuffle.", "memory_story": "Filters, order and range are the sieve, the sorting tray and the page cutter of your query.", "visual": "A long list narrowing, sorting and slicing into the first ten rows.", "emotion": "The satisfaction of a tidy list that loads quickly.", "meaning": "Methods such as eq, gt, ilike and in filter rows, order sorts them, and limit or range choose how many to read.", "code": "const { data } = await supabase\n  .from(\"todos\")\n  .select(\"*\")\n  .eq(\"done\", false)\n  .order(\"created_at\", { ascending: false })\n  .range(0, 9);", "output": "The ten newest todos that are not done.", "explanation": "Common filters are eq, neq, gt, gte, lt, lte, like, ilike, in and is. order sorts by a column and accepts ascending false for newest first. range takes zero-based start and end positions, so range(0, 9) returns the first ten rows. limit sets a maximum count.", "simple_explain": "Chain a filter to narrow rows, order to sort them, and range to take a page. Change the numbers in range to load the next page.", "analogy": "It is like a sieve, a sorting tray and a page cutter on your query.", "syntax": ".eq(\"col\", value).order(\"col\", { ascending }).range(from, to)", "anatomy": "eq = equals | order = sort | range = zero-based page window", "example_1": ".gt(\"price\", 100)", "example_2": ".ilike(\"title\", \"%milk%\")", "example_3": ".in(\"status\", [\"open\", \"paid\"])", "variation": ".range(10, 19)   // the second page of ten\n.or(\"done.eq.true,priority.gt.2\")   // either condition", "used_with": "select, limit, count, indexes", "related": "select, pagination, indexes", "alternatives": "A database function called with rpc for complex filters", "where_used": "Lists and tables | Search boxes | Infinite scroll", "mini_conversation": "A: How do I show the newest ten items? | B: Order by created_at descending and use range 0 to 9.", "misconception": "✗ range(1, 10) returns the first ten rows → ✓ range uses zero-based positions, so range(0, 9) returns the first ten rows", "confused_with": "limit vs range: limit sets a maximum count, range picks a start and end position.", "avoid": "Do not paginate without a stable order.", "wrong_code": ".range(1, 10)", "right_code": ".range(0, 9)", "memory_trick": "Range starts counting at zero.", "real_project": "Loading a feed in pages of twenty with order and range.", "real_interview": "An interviewer may ask: How do you paginate results in supabase-js?", "real_daily": "It is like a sieve, a sorting tray and a page cutter.", "mcq_question": "Which call returns the first ten rows?", "mcq_options": "A) range(0, 9) B) range(1, 10) C) range(10, 0) D) range(9, 9)", "mcq_answer": "A", "mcq_why": "Positions start at zero, so 0 to 9 is ten rows.", "fill_blank": "Sort newest first with .order(\"created_at\", { ascending: ____ }) → false", "hindi_to_task": "Read todos that are done, newest first.", "task_answer": "await supabase.from(\"todos\").select(\"*\").eq(\"done\", true).order(\"created_at\", { ascending: false });", "own_task": "Write a query for the second page of ten products under a price limit.", "practice_question": "Which filter does a case-insensitive text match?", "practice_answer": "ilike", "id": "SUP-020", "topic": "03 API and client", "level": "Intermediate", "type": "code56"}, {"term": "RPC (database functions)", "cue": "How do you call a Postgres function you wrote from your app, so heavy logic runs inside the database?", "kind": "JavaScript method", "frequency": "Medium", "importance": "4", "origin": "Some work, such as multi-step updates or aggregates, is faster and safer inside the database, so Supabase lets the client call Postgres functions through the API.", "pro_tip": "Use functions for multi-step changes that must succeed or fail together, and keep security in mind.", "memory_story": "RPC is dialling the database's own helper by name and passing it the numbers it needs.", "visual": "A function name with arguments going to the database and a result coming back.", "emotion": "The power of running complex logic next to the data.", "meaning": "rpc calls a stored Postgres function by name with arguments and returns its result.", "code": "-- SQL\ncreate function total_todos(owner uuid) returns bigint language sql as $$\n  select count(*) from todos where user_id = owner;\n$$;\n// JavaScript\nconst { data, error } = await supabase.rpc(\"total_todos\", { owner: userId });", "output": "The number of todos that belong to the given user.", "explanation": "You write the function in SQL or PL/pgSQL, and it appears in the API as a callable endpoint. Arguments are passed as an object whose keys match the parameter names. Functions run with the caller's rights by default, and security definer functions run with the owner's rights, which needs great care.", "simple_explain": "Write a function in the database, then call it by name with rpc. It is useful for heavy or multi-step logic that should happen close to the data.", "analogy": "It is like dialling the database's own helper by name and passing it the numbers it needs.", "syntax": "await supabase.rpc(\"function_name\", { arg: value })", "anatomy": "rpc = call a function | \"function_name\" = its name | { arg: value } = named arguments", "example_1": "await supabase.rpc(\"total_todos\", { owner: userId });", "example_2": "await supabase.rpc(\"search_lessons\", { term: \"api\" });", "example_3": "create function add_one(x int) returns int language sql as $$ select x + 1 $$;", "variation": "security definer   // runs with the owner's rights, use carefully\nlanguage plpgsql   // for procedural logic with variables", "used_with": "SQL functions, PL/pgSQL, RLS, transactions", "related": "database functions and triggers, REST API, Row Level Security", "alternatives": "Several client calls or an edge function", "where_used": "Aggregates | Multi-step updates | Search functions", "mini_conversation": "A: I need to update three tables together safely. | B: Put the steps in a database function and call it with rpc.", "misconception": "✗ Functions called through rpc always bypass Row Level Security → ✓ By default they run with the caller's rights, and only security definer functions run with the owner's rights", "confused_with": "rpc vs edge function: rpc runs inside the database, an edge function runs your own server code outside it.", "avoid": "Do not make a function security definer without understanding the risk.", "wrong_code": "await supabase.rpc(\"total_todos\", userId);", "right_code": "await supabase.rpc(\"total_todos\", { owner: userId });", "memory_trick": "rpc passes named arguments in an object.", "real_project": "Calling a function that moves points between two users in one transaction.", "real_interview": "An interviewer may ask: When would you use a database function instead of several client calls?", "real_daily": "It is like dialling a helper by name and giving it numbers.", "mcq_question": "How are arguments passed to rpc?", "mcq_options": "A) As an object with named keys B) As a single string C) As a CSS rule D) As a table", "mcq_answer": "A", "mcq_why": "Keys in the object match the function's parameter names.", "fill_blank": "await supabase.____(\"total_todos\", { owner: userId }); → rpc", "hindi_to_task": "Call a database function named total_notes with no arguments.", "task_answer": "await supabase.rpc(\"total_notes\");", "own_task": "Write a SQL function that returns the number of lessons in a course.", "practice_question": "What does security definer change about a function?", "practice_answer": "It makes the function run with its owner's rights instead of the caller's.", "id": "SUP-021", "topic": "03 API and client", "level": "Advanced", "type": "code56"}, {"term": "Supabase Auth", "cue": "Which built-in Supabase service handles sign-up, login, passwords, social providers and user accounts?", "category": "Authentication", "frequency": "Very high", "importance": "5", "origin": "Almost every app needs accounts, and building secure login yourself is hard to get right, so Supabase includes an authentication service that is tied directly to the database.", "pro_tip": "Users are stored in the auth.users table, so link your own profiles table to it by id.", "memory_story": "Supabase Auth is the front-desk security that checks identities and hands out passes to the rest of the building.", "visual": "A login form connected to a users table and a pass being handed to the app.", "emotion": "The relief of not building password handling from scratch.", "definition": "Supabase Auth is the service that registers users, verifies their identity by password, magic link or social provider, and issues tokens that the database and API trust.", "explanation": "Users are stored in a protected auth.users table. After login, the client holds a session with an access token (a JWT) and a refresh token. The database reads the token to know who is calling, which is what lets Row Level Security policies use auth.uid(). You can enable providers and email settings in the dashboard.", "simple_explain": "Auth creates and checks user accounts for you. After login your app holds a token, and the database uses it to know which user is asking.", "analogy": "It is like front-desk security that checks identities and hands out passes to the rest of the building.", "formula_rule": "Sign up or log in → session with a token → database knows auth.uid()", "example_1": "A user signing up with email and password.", "example_2": "A user logging in with a GitHub account.", "example_3": "A profiles table whose id equals the user's id in auth.users.", "related": "sessions and JWT, Row Level Security, OAuth, magic links", "word_family": "auth.users, session, token, provider, JWT", "where_used": "Any app with accounts | Per-user data | Social login", "mini_conversation": "A: Where are my users stored? | B: In the auth.users table, and you link your profiles table to it.", "misconception": "✗ I should store passwords in my own table → ✓ Supabase Auth stores and hashes credentials for you in auth.users, and your tables should only reference the user id", "contrast": "auth.users vs profiles: auth.users holds account and login data, your profiles table holds app-specific details.", "avoid": "Do not copy passwords or secrets into your own tables.", "memory_trick": "Auth gives each user an id, link to it.", "real_project": "Creating a profiles table linked to auth.users for each learner.", "real_interview": "An interviewer may ask: How does Supabase know which user is making a request?", "real_daily": "It is like front-desk security handing out passes.", "mcq_question": "Where does Supabase store registered users?", "mcq_options": "A) auth.users B) todos C) storage.objects D) public.profiles only", "mcq_answer": "A", "mcq_why": "The auth schema holds the users table managed by Supabase Auth.", "fill_blank": "After login, the client holds a session containing an access ____ → token", "apply": "How do you store extra details about each user? → Create a profiles table linked to the user's id", "explain_task": "Explain Supabase Auth in three lines.", "own_task": "Design a profiles table that links to auth.users.", "id": "SUP-022", "topic": "04 Auth", "level": "Beginner", "type": "topic56"}, {"term": "Email and password sign-up and login", "cue": "Which supabase-js methods create an account and log a user in with an email and password?", "kind": "JavaScript method", "frequency": "Very high", "importance": "5", "origin": "Email and password is the most familiar way to sign in, so the auth client provides simple methods for registering and signing in with it.", "pro_tip": "Expect to confirm the email address by default, and handle that state in your interface.", "memory_story": "signUp opens the account and signInWithPassword unlocks it on later visits.", "visual": "A form sending an email and password and receiving a session.", "emotion": "The pleasure of the first successful login.", "meaning": "auth.signUp creates a new user, and auth.signInWithPassword logs an existing user in.", "code": "const { error: signUpError } = await supabase.auth.signUp({\n  email: \"asha@example.com\",\n  password: \"a-long-strong-password\"\n});\nconst { data, error } = await supabase.auth.signInWithPassword({\n  email: \"asha@example.com\",\n  password: \"a-long-strong-password\"\n});", "output": "signUp creates the user, and signInWithPassword returns data.session with the access token when the credentials are correct.", "explanation": "With the default settings a new user must confirm their email before they can sign in, and the confirmation email contains a link. Passwords are hashed by Supabase and never stored in plain text. Wrong credentials return an error, so check it. The session is stored by the library and refreshed automatically.", "simple_explain": "Call signUp once to create the account and signInWithPassword to log in. Always check the error and handle the email confirmation step.", "analogy": "It is like opening an account at a bank and then showing your card on each visit.", "syntax": "supabase.auth.signUp({ email, password })  |  supabase.auth.signInWithPassword({ email, password })", "anatomy": "signUp = create the account | signInWithPassword = log in | session = what you get on success", "example_1": "await supabase.auth.signUp({ email, password });", "example_2": "await supabase.auth.signInWithPassword({ email, password });", "example_3": "await supabase.auth.signOut();", "variation": "await supabase.auth.resetPasswordForEmail(email)   // start a password reset", "used_with": "session, email confirmation, signOut, RLS", "related": "Supabase Auth, sessions and JWT, magic link", "alternatives": "Magic links or social login", "where_used": "Sign-up pages | Login pages | Account recovery", "mini_conversation": "A: A new user cannot log in right after signing up. | B: They may need to confirm their email first.", "misconception": "✗ signUp logs the user in with no further steps in every setup → ✓ With email confirmation on, the user must confirm their address before they can sign in", "confused_with": "signUp vs signIn: signUp creates the account, signIn logs in an existing one.", "avoid": "Do not ignore the error returned by the call.", "wrong_code": "await supabase.auth.signIn({ email, password });", "right_code": "await supabase.auth.signInWithPassword({ email, password });", "memory_trick": "signUp creates the account, signIn enters it.", "real_project": "Building a login page that shows a message to confirm the email.", "real_interview": "An interviewer may ask: How does Supabase protect user passwords?", "real_daily": "It is like opening a bank account and showing your card on each visit.", "mcq_question": "Which method logs in with an email and password?", "mcq_options": "A) signInWithPassword B) signUp C) signOut D) getUser", "mcq_answer": "A", "mcq_why": "signInWithPassword authenticates an existing user.", "fill_blank": "await supabase.auth.____(); logs the user out → signOut", "hindi_to_task": "Create an account with an email and password.", "task_answer": "await supabase.auth.signUp({ email, password });", "own_task": "Write sign-up and login functions for a form.", "practice_question": "Why might a new user be unable to log in immediately?", "practice_answer": "Email confirmation may be required first.", "id": "SUP-023", "topic": "04 Auth", "level": "Beginner", "type": "code56"}, {"term": "Social login (OAuth providers)", "cue": "How do you let users sign in with an existing account such as GitHub or Google?", "kind": "JavaScript method", "frequency": "High", "importance": "4", "origin": "Users dislike creating yet another password, so Supabase supports signing in through trusted providers using OAuth.", "pro_tip": "Add your site's redirect URLs to the allowed list in the Auth settings, or the login will be rejected.", "memory_story": "Social login is showing a trusted ID from another club, so this club lets you in without a new card.", "visual": "A button sending the user to a provider and returning with a session.", "emotion": "The convenience of one click sign in.", "meaning": "signInWithOAuth sends the user to a provider to log in and then returns them to your site with a session.", "code": "await supabase.auth.signInWithOAuth({\n  provider: \"github\",\n  options: { redirectTo: \"https://example.com/auth/callback\" }\n});", "output": "The browser goes to GitHub to log in, then returns to the redirect address with the user signed in.", "explanation": "First enable the provider in the dashboard and paste the client id and secret from the provider. Then allow your redirect URLs in the Auth settings. Supabase handles the OAuth exchange and creates the user in auth.users. Providers include Google, GitHub, Apple and many more.", "simple_explain": "Turn on a provider in the dashboard, then call signInWithOAuth with its name. The user logs in there and comes back signed in.", "analogy": "It is like showing a trusted ID from another club so this club lets you in without a new card.", "syntax": "supabase.auth.signInWithOAuth({ provider, options })", "anatomy": "provider = which service | redirectTo = where to return | options = extra settings", "example_1": "await supabase.auth.signInWithOAuth({ provider: \"google\" });", "example_2": "await supabase.auth.signInWithOAuth({ provider: \"github\", options: { redirectTo } });", "example_3": "A callback page that finishes the login after the redirect.", "variation": "scopes: \"read:user\"   // extra permissions from the provider", "used_with": "redirect URLs, provider settings, sessions", "related": "Supabase Auth, OAuth 2.0, sessions and JWT", "alternatives": "Email and password or magic links", "where_used": "Sign-in pages | Consumer apps | Developer tools", "mini_conversation": "A: The Google login returns an error about the redirect. | B: Add that redirect URL to the allowed list in the Auth settings.", "misconception": "✗ Social login works without any setup in the provider or dashboard → ✓ You must enable the provider, add its client id and secret, and allow your redirect URLs", "confused_with": "Social login vs password login: social login delegates identity to a provider, password login stores credentials with Supabase.", "avoid": "Do not commit provider secrets to code.", "wrong_code": "await supabase.auth.signInWithOAuth(\"github\");", "right_code": "await supabase.auth.signInWithOAuth({ provider: \"github\" });", "memory_trick": "Enable the provider, allow the redirect.", "real_project": "Adding a Sign in with Google button that returns to the dashboard page.", "real_interview": "An interviewer may ask: What do you configure to add Google login?", "real_daily": "It is like showing a trusted ID from another club.", "mcq_question": "What must you configure besides calling the method?", "mcq_options": "A) The provider and the allowed redirect URLs B) A new table C) A bucket D) An index", "mcq_answer": "A", "mcq_why": "The provider must be enabled and the redirect must be allowed.", "fill_blank": "The page the user returns to after login is the ____ URL → redirect", "hindi_to_task": "Start a GitHub login.", "task_answer": "await supabase.auth.signInWithOAuth({ provider: \"github\" });", "own_task": "List the setup steps to add Google login.", "practice_question": "Where do you enter a provider's client id and secret?", "practice_answer": "In the Authentication provider settings of the dashboard.", "id": "SUP-024", "topic": "04 Auth", "level": "Intermediate", "type": "code56"}, {"term": "Magic links and one-time codes", "cue": "How can a user log in without a password by receiving a link or code by email?", "kind": "JavaScript method", "frequency": "Medium", "importance": "3", "origin": "Passwords are forgotten and reused, so passwordless login proves the user owns an email address by sending them a one-time link or code.", "pro_tip": "Customise the email template so users know whether to click a link or type a code.", "memory_story": "A magic link is a one-time key posted to your own mailbox that opens the door once.", "visual": "An email containing a link, which opens the app already signed in.", "emotion": "The ease of logging in with no password to remember.", "meaning": "signInWithOtp sends a one-time login link or code to the user's email, and the user proves access by using it.", "code": "await supabase.auth.signInWithOtp({ email: \"asha@example.com\" });\n// If the email contains a code instead of a link:\nawait supabase.auth.verifyOtp({ email: \"asha@example.com\", token: \"123456\", type: \"email\" });", "output": "An email is sent, and after the link is opened or the code verified, the user is signed in.", "explanation": "Whether the email carries a link or a code depends on the template you configure. A link opens your redirect URL and signs the user in. With codes, you collect the digits in a form and call verifyOtp. If the user does not exist, the call can create one, depending on your settings.", "simple_explain": "Ask Supabase to send a one-time link or code. The user clicks it or types it, and is logged in without any password.", "analogy": "It is like a one-time key posted to your mailbox that opens the door once.", "syntax": "supabase.auth.signInWithOtp({ email })  |  supabase.auth.verifyOtp({ email, token, type })", "anatomy": "signInWithOtp = send the link or code | verifyOtp = check a typed code | type = the kind of token", "example_1": "await supabase.auth.signInWithOtp({ email });", "example_2": "await supabase.auth.verifyOtp({ email, token, type: \"email\" });", "example_3": "await supabase.auth.signInWithOtp({ phone: \"+911234567890\" });", "variation": "options: { shouldCreateUser: false }   // do not create new users", "used_with": "email templates, redirect URLs, verifyOtp", "related": "email and password, Supabase Auth, sessions", "alternatives": "Passwords or social login", "where_used": "Passwordless sign-in | Mobile apps | Low-friction onboarding", "mini_conversation": "A: Users forget their passwords all the time. | B: Offer a magic link or a one-time code instead.", "misconception": "✗ A magic link needs the user to set a password first → ✓ A magic link or code replaces the password by proving access to the email", "confused_with": "Magic link vs OTP code: a link is clicked, a code is typed and verified.", "avoid": "Do not make links last for a long time.", "wrong_code": "await supabase.auth.signInWithOtp(email);", "right_code": "await supabase.auth.signInWithOtp({ email });", "memory_trick": "One time, one email, one login.", "real_project": "Letting learners log in with a link sent to their email.", "real_interview": "An interviewer may ask: What are the benefits of passwordless login?", "real_daily": "It is like a one-time key sent to your mailbox.", "mcq_question": "What does signInWithOtp send?", "mcq_options": "A) A one-time link or code B) A password C) A table D) A file", "mcq_answer": "A", "mcq_why": "It sends a one-time credential to the user's email or phone.", "fill_blank": "A typed one-time code is checked with
