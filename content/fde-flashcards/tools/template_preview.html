____Otp → verify", "hindi_to_task": "Send a magic link to asha@example.com.", "task_answer": "await supabase.auth.signInWithOtp({ email: \"asha@example.com\" });", "own_task": "Write the two steps for a code based login form.", "practice_question": "Which method checks a typed code?", "practice_answer": "verifyOtp", "id": "SUP-025", "topic": "04 Auth", "level": "Intermediate", "type": "code56"}, {"term": "Sessions and JWT in Supabase", "cue": "What does the client hold after login that proves who the user is on each request, and why does it expire?", "category": "Authentication concept", "frequency": "High", "importance": "4", "origin": "The database needs proof of identity on every call, so Supabase gives each logged-in user a signed, short-lived token and a refresh token to renew it.", "pro_tip": "Let the client library refresh sessions for you, and avoid storing tokens by hand.", "memory_story": "The session is a wristband that expires, and the refresh token is how you get a new one without queuing again.", "visual": "A session object holding a short-lived token and a longer-lived refresh token.", "emotion": "The understanding that explains why login seems to last.", "definition": "A session holds an access token (a signed JWT) that proves the user's identity, and a refresh token used to get new access tokens when the old one expires.", "explanation": "The JWT contains claims such as the user id (sub) and role, and an expiry time. Supabase sends it with each request, and the database reads it to apply Row Level Security through auth.uid(). Access tokens are short-lived, often around an hour by default, and the library refreshes them automatically using the refresh token.", "simple_explain": "After login you hold a session. Its token tells the database who you are, expires soon, and is renewed automatically with the refresh token.", "analogy": "The session is an event wristband that expires, and the refresh token gets you a new one without queuing again.", "formula_rule": "Session = access token (JWT) + refresh token", "example_1": "A token whose sub claim is the user's id.", "example_2": "The library renewing the token before it expires.", "example_3": "A policy using auth.uid(), which is read from the token.", "related": "JWT, Row Level Security, getUser vs getSession", "word_family": "session, access token, refresh token, JWT, expiry", "where_used": "Every logged-in request | RLS policies | Mobile and web apps", "mini_conversation": "A: Why does the user stay logged in after an hour? | B: The library refreshes the access token with the refresh token.", "misconception": "✗ The access token never expires once the user logs in → ✓ Access tokens are short-lived and are renewed with the refresh token", "contrast": "Access token vs refresh token: the access token proves identity on requests, the refresh token only gets new access tokens.", "avoid": "Do not store or log tokens carelessly.", "memory_trick": "The token expires, the refresh renews.", "real_project": "Relying on the client library to keep sessions fresh in a long-running app.", "real_interview": "An interviewer may ask: How does the database know who is making a request?", "real_daily": "It is like an event wristband that expires.", "mcq_question": "What do policies read to know the current user?", "mcq_options": "A) The JWT claims through auth.uid() B) The browser theme C) The table name D) The index", "mcq_answer": "A", "mcq_why": "auth.uid() reads the user id from the token.", "fill_blank": "A short-lived signed token is called a ____ → JWT", "apply": "Why does a session need a refresh token? → To get new access tokens when the old one expires", "explain_task": "Explain a session and its tokens in three lines.", "own_task": "Write what happens from login to token refresh.", "id": "SUP-026", "topic": "04 Auth", "level": "Intermediate", "type": "topic56"}, {"term": "getUser vs getSession", "cue": "Which two calls read the current user, and which one should server code trust because it checks the token with the Auth server?", "category": "Authentication concept", "frequency": "High", "importance": "5", "origin": "A session read from cookies or storage can be forged or stale, so server code needs a call that verifies the token with the Auth service.", "pro_tip": "In server code, use getUser to verify the user, and use getSession only for non-security purposes.", "memory_story": "getSession reads the wristband, and getUser asks the front desk whether the wristband is real.", "visual": "One arrow reading local storage and another asking the Auth server for confirmation.", "emotion": "The reassurance of verifying instead of assuming.", "definition": "getSession returns the session stored on the client or in cookies without checking it, while getUser sends the token to the Auth server and returns the verified user.", "explanation": "In the browser, getSession is convenient for reading what the library holds. On the server, the cookie data comes from the request and could be tampered with, so authorisation decisions should use getUser, which validates the token. Recent library versions even warn when you use session data on the server without verification.", "simple_explain": "Use getUser on the server whenever you decide what a user may do. getSession only reads what is stored and does not prove it is genuine.", "analogy": "getSession reads the wristband, and getUser asks the front desk whether the wristband is real.", "formula_rule": "Server decisions → getUser (verified). Client display → getSession is fine.", "example_1": "A server route calling await supabase.auth.getUser() before returning private data.", "example_2": "A client component reading the session to show the user's name.", "example_3": "Middleware using getUser to refresh and verify the session.", "related": "sessions and JWT, server-side auth, Row Level Security", "word_family": "getUser, getSession, verify, cookies, server", "where_used": "Server routes | Middleware | Protected pages", "mini_conversation": "A: Is it safe to trust getSession in my API route? | B: No, use getUser, which verifies the token with the Auth server.", "misconception": "✗ getSession on the server is as trustworthy as getUser → ✓ getSession does not verify the token on the server, so use getUser for security decisions", "contrast": "getUser vs getSession: getUser verifies with the Auth server, getSession only reads stored data.", "avoid": "Do not authorise server actions based on getSession alone.", "memory_trick": "On the server, always trust getUser.", "real_project": "Using getUser in middleware to protect private pages.", "real_interview": "An interviewer may ask: Which call should you use to verify a user on the server?", "real_daily": "It is like asking the front desk whether a wristband is real.", "mcq_question": "Which call verifies the token with the Auth server?", "mcq_options": "A) getUser B) getSession C) signOut D) onAuthStateChange", "mcq_answer": "A", "mcq_why": "getUser validates the token with the Auth service.", "fill_blank": "On the server, security decisions should use ____ → getUser", "apply": "A server route returns private data. Which call should check the user? → getUser", "explain_task": "Explain getUser and getSession in three lines.", "own_task": "Write which call you would use in middleware and why.", "id": "SUP-027", "topic": "04 Auth", "level": "Advanced", "type": "topic56"}, {"term": "Server-side auth with cookies (@supabase/ssr)", "cue": "Which package helps frameworks with server rendering keep the Supabase session in cookies for both browser and server code?", "category": "Authentication concept", "frequency": "High", "importance": "4", "origin": "Server-rendered apps run code on the server, which cannot read browser storage, so sessions are kept in cookies that both sides can see.", "pro_tip": "Create a browser client for client components and a server client for server code, and refresh the session in middleware.", "memory_story": "Cookies are the passport that travels with every request, so the server and the browser share one identity.", "visual": "A cookie being sent with each request to a server that builds its own client from it.", "emotion": "The satisfaction of a logged-in page that renders correctly on the server.", "definition": "@supabase/ssr provides createBrowserClient and createServerClient, which store the session in cookies so server-rendered frameworks such as Next.js can read it.", "explanation": "In frameworks such as Next.js, server components, route handlers and middleware need the session. The ssr package builds clients that read and write cookies. Middleware usually calls getUser on each request to refresh and verify the session and to protect routes. Each server request should create its own client, because it uses that request's cookies.", "simple_explain": "Server code cannot see browser storage, so the session goes in cookies. Use the ssr helpers to build the right client for each place and refresh the session in middleware.", "analogy": "Cookies are a passport that travels with every request, so the server and the browser share one identity.", "formula_rule": "Cookies carry the session → server client reads them → middleware refreshes and verifies", "example_1": "createBrowserClient used in a client component.", "example_2": "createServerClient used in a server component with the request's cookies.", "example_3": "Middleware calling getUser to protect an admin route.", "related": "createClient, getUser vs getSession, Next.js, cookies", "word_family": "ssr, cookies, middleware, server client, browser client", "where_used": "Next.js | SvelteKit | Server-rendered apps", "mini_conversation": "A: My server component thinks the user is logged out. | B: Create the server client with the request's cookies, and refresh the session in middleware.", "misconception": "✗ One global client works for every server request → ✓ Each server request needs its own client built from that request's cookies", "contrast": "Browser client vs server client: the browser client uses browser cookies, the server client reads cookies from the incoming request.", "avoid": "Do not share one server client between different users' requests.", "memory_trick": "Cookies carry the session to the server.", "real_project": "Protecting dashboard routes in Next.js with middleware and getUser.", "real_interview": "An interviewer may ask: How do you handle Supabase auth in a server-rendered app?", "real_daily": "It is like a passport that travels with every request.", "mcq_question": "Where does @supabase/ssr keep the session?", "mcq_options": "A) In cookies B) In a table C) In a bucket D) In an index", "mcq_answer": "A", "mcq_why": "Cookies are visible to both the browser and the server.", "fill_blank": "Session refresh and route protection are often done in ____ → middleware", "apply": "A server component cannot see the user. What should you check? → That the server client is built with the request's cookies", "explain_task": "Explain server-side auth with cookies in three lines.", "own_task": "Write which client you would use in a client component and a server component.", "id": "SUP-028", "topic": "04 Auth", "level": "Advanced", "type": "topic56"}, {"term": "Row Level Security (RLS)", "cue": "Which Postgres feature lets the database itself decide which rows each user may read or change?", "category": "Security", "frequency": "Very high", "importance": "5", "origin": "Browsers talk to the database through an open API, so the rules about who sees what must live in the database, and Postgres provides row-level policies for exactly this.", "pro_tip": "Turn on RLS for every table in an exposed schema, and write policies before launching.", "memory_story": "RLS is a guard at each row, checking your badge before letting you see or change it.", "visual": "A table where each row has a lock that opens only for the matching user.", "emotion": "The calm of knowing a user cannot read another user's data.", "definition": "Row Level Security is a Postgres feature in which policies attached to a table decide, for each row, whether the current user may select, insert, update or delete it.", "explanation": "When RLS is enabled on a table, access through the API is denied by default until you add policies. A policy is a rule such as auth.uid() = user_id. The anon and authenticated roles are subject to it, while the service role bypasses it. This is what makes it safe for the browser to call the database directly with the client key.", "simple_explain": "RLS puts rules on rows. Turn it on, then write policies like each user can see only their own rows, and the database enforces them for every request.", "analogy": "It is like a guard at each row who checks your badge before letting you see or change it.", "formula_rule": "Enable RLS → no access → add policies → access only where a policy allows", "example_1": "A todos table where users see only rows with their own user_id.", "example_2": "A public blog table where everyone can read but only authors can write.", "example_3": "A private messages table visible only to sender and receiver.", "related": "policies, auth.uid(), anon vs service role key, Supabase Auth", "word_family": "RLS, policy, role, USING, WITH CHECK", "where_used": "Every table exposed to the API | Multi-user apps | Data privacy", "mini_conversation": "A: Can users read each other's tasks through the API? | B: Not if RLS is on with a policy that matches each user's own rows.", "misconception": "✗ The client key is enough to protect data without RLS → ✓ The client key is public, so RLS is what actually keeps data safe", "contrast": "RLS vs app-level checks: RLS is enforced by the database for every request, app checks can be bypassed.", "avoid": "Do not expose a table to the API with RLS turned off.", "memory_trick": "RLS guards every single row for you.", "real_project": "Making each learner's progress rows visible only to that learner.", "real_interview": "An interviewer may ask: Why is RLS important in Supabase?", "real_daily": "It is like a guard checking your badge at every row.", "mcq_question": "What happens to API access on a table with RLS enabled but no policies?", "mcq_options": "A) Access is denied B) Everyone can read C) Only admins can read D) The table is deleted", "mcq_answer": "A", "mcq_why": "With RLS on, access is denied until a policy allows it.", "fill_blank": "RLS rules are written as ____ on a table → policies", "apply": "How do you let users see only their own rows? → Enable RLS and add a policy comparing auth.uid() with the row's user id", "explain_task": "Explain Row Level Security in three lines.", "own_task": "Write the rule in words for a notes table that only owners may read.", "id": "SUP-029", "topic": "05 Row Level Security", "level": "Intermediate", "type": "topic56"}, {"term": "Enabling RLS on a table", "cue": "Which SQL statement switches on Row Level Security so that policies start to apply?", "kind": "SQL statement", "frequency": "Very high", "importance": "5", "origin": "A table created with SQL is open until you protect it, so RLS has to be explicitly enabled before policies take effect.", "pro_tip": "Enable RLS right after creating each table, so it is never exposed unprotected by mistake.", "memory_story": "Enabling RLS is locking the door, and policies are the keys you hand out afterwards.", "visual": "A table icon with a padlock being closed.", "emotion": "The relief of locking the door before anyone walks in.", "meaning": "alter table ... enable row level security turns on RLS, after which only rows allowed by policies are accessible to the API roles.", "code": "alter table todos enable row level security;", "output": "RLS is on for todos, and without policies the API returns no rows to anon and authenticated users.", "explanation": "Tables made in the dashboard's Table Editor usually offer an option to enable RLS, but tables made with SQL do not have it enabled by default. After enabling, add policies for each operation you want to allow. The table owner and roles with bypass privileges are not restricted.", "simple_explain": "Run the statement once per table. After that, nothing is readable or writable through the API until you add policies.", "analogy": "It is like locking the door, with policies as the keys you hand out afterwards.", "syntax": "alter table table_name enable row level security;", "anatomy": "alter table = change the table | enable row level security = turn RLS on", "example_1": "alter table todos enable row level security;", "example_2": "alter table profiles enable row level security;", "example_3": "alter table todos force row level security;", "variation": "alter table todos disable row level security;   // turn it off, risky\nforce row level security   // also applies to the table owner", "used_with": "policies, SQL Editor, API exposure", "related": "Row Level Security, policies, SQL Editor", "alternatives": "The RLS toggle in the Table Editor", "where_used": "Every new table | Security reviews | Migrations", "mini_conversation": "A: I created a table with SQL and anyone can read it. | B: You forgot to enable row level security on it.", "misconception": "✗ Tables created with SQL are protected automatically → ✓ RLS must be enabled for each table you create with SQL", "confused_with": "enable vs force: enable applies to API roles, force also applies to the table owner.", "avoid": "Do not leave exposed tables without RLS.", "wrong_code": "alter table todos enable rls;", "right_code": "alter table todos enable row level security;", "memory_trick": "Create the table, then lock the table.", "real_project": "Putting the enable statement in every create table migration.", "real_interview": "An interviewer may ask: What is the default access of a table after enabling RLS?", "real_daily": "It is like locking the door before handing out keys.", "mcq_question": "What do you do first to make policies take effect?", "mcq_options": "A) Enable row level security B) Create an index C) Rename the table D) Create a bucket", "mcq_answer": "A", "mcq_why": "Policies only apply after RLS is enabled.", "fill_blank": "alter table todos enable row level ____; → security", "hindi_to_task": "Enable RLS on the notes table.", "task_answer": "alter table notes enable row level security;", "own_task": "Write the statements to create and protect a table.", "practice_question": "What can API users do on an RLS table that has no policies?", "practice_answer": "Nothing, access is denied until policies allow it.", "id": "SUP-030", "topic": "05 Row Level Security", "level": "Intermediate", "type": "code56"}, {"term": "Policies (USING and WITH CHECK)", "cue": "Which two clauses of a policy decide which existing rows a user may see, and which new values they may write?", "kind": "SQL statement", "frequency": "Very high", "importance": "5", "origin": "Reading and writing need different checks, so policies have a clause for choosing visible rows and another for validating new or changed rows.", "pro_tip": "Wrap auth.uid() as (select auth.uid()) in policies so Postgres can cache it and run faster.", "memory_story": "USING decides what you may look at, and WITH CHECK decides what you may put in.", "visual": "One filter on existing rows and another gate on rows being written.", "emotion": "The satisfaction of a rule that stops a cheat before it lands.", "meaning": "USING filters which existing rows a policy applies to, and WITH CHECK validates the values of rows being inserted or updated.", "code": "create policy \"Users read own todos\" on todos\n  for select to authenticated\n  using ((select auth.uid()) = user_id);\ncreate policy \"Users insert own todos\" on todos\n  for insert to authenticated\n  with check ((select auth.uid()) = user_id);", "output": "Logged-in users can read only their own rows and can only insert rows whose user_id is their own.", "explanation": "Select and delete use USING because they act on existing rows. Insert uses WITH CHECK because it validates new rows. Update can use both: USING picks the rows you may edit, and WITH CHECK validates what the row becomes. You can write separate policies per operation, or one policy for all.", "simple_explain": "Use USING to say which rows are visible or editable. Use WITH CHECK to say what a new or changed row is allowed to look like.", "analogy": "USING decides what you may look at, and WITH CHECK decides what you may put in.", "syntax": "create policy name on table for operation to role using (condition) with check (condition);", "anatomy": "for = which operation | to = which role | using = existing rows | with check = new values", "example_1": "using ((select auth.uid()) = user_id)", "example_2": "with check ((select auth.uid()) = user_id)", "example_3": "create policy \"Public read\" on posts for select using (true);", "variation": "for all using (...) with check (...)   // one policy for every operation\nto anon, authenticated   // apply to both roles", "used_with": "auth.uid(), enable row level security, roles", "related": "Row Level Security, auth.uid(), enabling RLS", "alternatives": "Database functions that check access", "where_used": "Every multi-user table | Public read tables | Private data", "mini_conversation": "A: Users can insert rows for other users. | B: Add a WITH CHECK clause that matches user_id to the logged-in user.", "misconception": "✗ USING alone protects inserts → ✓ Inserts are validated by WITH CHECK, so an insert policy needs that clause", "confused_with": "USING vs WITH CHECK: USING filters existing rows, WITH CHECK validates written values.", "avoid": "Do not write an insert policy without WITH CHECK.", "wrong_code": "create policy \"insert own\" on todos for insert using (auth.uid() = user_id);", "right_code": "create policy \"insert own\" on todos for insert to authenticated with check ((select auth.uid()) = user_id);", "memory_trick": "USING looks, WITH CHECK writes.", "real_project": "Allowing learners to insert and read only their own progress rows.", "real_interview": "An interviewer may ask: What is the difference between USING and WITH CHECK?", "real_daily": "It is like what you may look at and what you may put in.", "mcq_question": "Which clause validates new rows on insert?", "mcq_options": "A) WITH CHECK B) USING C) ORDER BY D) LIMIT", "mcq_answer": "A", "mcq_why": "WITH CHECK validates the values being written.", "fill_blank": "A select policy uses the ____ clause → using", "hindi_to_task": "Write a select policy that lets users read only rows where user_id equals their id.", "task_answer": "create policy \"read own\" on todos for select to authenticated using ((select auth.uid()) = user_id);", "own_task": "Write read, insert, update and delete policies for a notes table.", "practice_question": "Which clause does an update policy use to pick editable rows?", "practice_answer": "USING", "id": "SUP-031", "topic": "05 Row Level Security", "level": "Intermediate", "type": "code56"}, {"term": "auth.uid() and auth.jwt()", "cue": "Which helper functions let a policy read the current user's id or claims from the request's token?", "kind": "SQL function", "frequency": "Very high", "importance": "5", "origin": "A policy must know who is asking, so Supabase exposes helpers that read the logged-in user's id and claims from the JWT.", "pro_tip": "Compare auth.uid() with a user_id column, and use auth.jwt() for custom claims such as roles.", "memory_story": "auth.uid() reads the name on the wristband, and auth.jwt() reads everything printed on it.", "visual": "A token being opened and its user id passed to the policy.", "emotion": "The satisfaction of a rule that always knows who is asking.", "meaning": "auth.uid() returns the id of the current user, and auth.jwt() returns the full set of token claims.", "code": "create policy \"Owner can update\" on profiles\n  for update to authenticated\n  using ((select auth.uid()) = id)\n  with check ((select auth.uid()) = id);\nselect auth.uid();", "output": "auth.uid() returns the current user's uuid, or null when nobody is logged in.", "explanation": "The function reads the sub claim of the JWT sent with the request. For logged-out users it returns null, so a comparison fails and no rows match. auth.jwt() returns the whole token as JSON, so you can read claims, such as app metadata, in policies. In the SQL Editor you are usually a powerful role, so auth.uid() may be null there.", "simple_explain": "Policies use auth.uid() to compare the row's owner with the person making the request. Logged-out users give null, so they match nothing.", "analogy": "auth.uid() reads the name on the wristband, and auth.jwt() reads everything printed on it.", "syntax": "auth.uid()  |  auth.jwt() ->> 'claim'", "anatomy": "auth.uid() = current user id | auth.jwt() = all claims as JSON | ->> = read one claim as text", "example_1": "using ((select auth.uid()) = id)", "example_2": "using ((select auth.jwt() ->> 'email') = owner_email)", "example_3": "using ((select auth.uid()) is not null)", "variation": "auth.role()   // the database role from the token, older style\n(auth.jwt() -> 'app_metadata' ->> 'role') = 'admin'   // a role stored in app metadata", "used_with": "policies, JWT, Supabase Auth", "related": "policies, sessions and JWT, Row Level Security", "alternatives": "A profiles table with a role column", "where_used": "Every RLS policy | Admin checks | Per-user filters", "mini_conversation": "A: My policy returns no rows in the SQL Editor. | B: In the editor auth.uid() is often null, so test through the client as a real user.", "misconception": "✗ auth.uid() works the same in the SQL Editor as in the app → ✓ The SQL Editor usually runs with a powerful role and no user token, so auth.uid() may be null there", "confused_with": "auth.uid() vs auth.jwt(): the first gives only the user id, the second gives all claims.", "avoid": "Do not trust claims that users can edit themselves, such as user metadata, for authorisation.", "wrong_code": "using (auth.uid = user_id)", "right_code": "using ((select auth.uid()) = user_id)", "memory_trick": "auth.uid() asks who is calling.", "real_project": "Limiting each profile row to its owner with auth.uid().", "real_interview": "An interviewer may ask: How does a policy know the current user?", "real_daily": "It is like reading the name on a wristband.", "mcq_question": "What does auth.uid() return for a logged-out request?", "mcq_options": "A) null B) The admin id C) An empty table D) A random id", "mcq_answer": "A", "mcq_why": "Without a token there is no user, so the result is null.", "fill_blank": "auth.____() returns the full token claims as JSON → jwt", "hindi_to_task": "Select the current user's id.", "task_answer": "select auth.uid();", "own_task": "Write a policy that lets a user read the row whose id equals their user id.", "practice_question": "Where does auth.uid() read the id from?", "practice_answer": "From the sub claim of the request's JWT.", "id": "SUP-032", "topic": "05 Row Level Security", "level": "Intermediate", "type": "code56"}, {"term": "Bypassing RLS (service role and postgres role)", "cue": "Which key and roles ignore Row Level Security, and when is it correct to use them?", "category": "Security concept", "frequency": "High", "importance": "5", "origin": "Trusted back-end jobs sometimes need full access to every row, so some roles are allowed to bypass RLS, and these must be kept out of untrusted code.", "pro_tip": "Use the service role only on a server you control, and do your own checks in that code.", "memory_story": "The master key opens every door, so it stays locked in the manager's office, never in a visitor's hands.", "visual": "A master key inside a locked server room, far from the browser.", "emotion": "The responsibility of holding the master key.", "definition": "The service role key and the postgres role bypass Row Level Security, so they can read and write every row regardless of policies.", "explanation": "Browser and app users run as the anon or authenticated role, so policies apply. The service role key makes requests as a role that bypasses RLS, which is useful for admin tasks, cron jobs and trusted server code. Direct database connections, such as those used by tools like Prisma with the postgres user, also bypass RLS, so authorisation must then be handled in your own code.", "simple_explain": "Anything that connects as the service role or the database owner ignores your policies. Keep such access on trusted servers and check permissions yourself there.", "analogy": "The master key opens every door, so it stays in the manager's office.", "formula_rule": "anon or authenticated = RLS applies. service role or postgres = RLS bypassed.", "example_1": "A nightly server job using the service role to clean old rows.", "example_2": "An admin script that reads every user's rows.", "example_3": "An ORM connecting as the postgres user, which ignores policies.", "related": "anon vs service role key, Prisma and Supabase, Row Level Security", "word_family": "bypass, service_role, postgres, owner, admin", "where_used": "Server jobs | Admin tools | ORM connections", "mini_conversation": "A: Our ORM can read every row, ignoring the policies. | B: It connects as a role that bypasses RLS, so check access in your own code.", "misconception": "✗ RLS protects data against every kind of connection → ✓ Roles that bypass RLS, such as the service role and the postgres user, ignore policies", "contrast": "App role vs service role: the app role obeys policies, the service role ignores them.", "avoid": "Do not use the service role in code that runs for end users in the browser.", "memory_trick": "Master keys bypass the guards.", "real_project": "Using the service role only in a server cron job that cleans expired rows.", "real_interview": "An interviewer may ask: Which roles bypass RLS in Supabase?", "real_daily": "It is like a master key that opens every door.", "mcq_question": "Which key makes requests that ignore RLS?", "mcq_options": "A) The service role key B) The anon key C) A signed URL D) A magic link", "mcq_answer": "A", "mcq_why": "The service role bypasses Row Level Security.", "fill_blank": "Browser users run as the anon or ____ role → authenticated", "apply": "An ORM connects as postgres. How do you protect data? → Enforce authorisation in your own server code", "explain_task": "Explain which roles bypass RLS in three lines.", "own_task": "List two places where bypassing RLS is appropriate and two where it is not.", "id": "SUP-033", "topic": "05 Row Level Security", "level": "Advanced", "type": "topic56"}, {"term": "Testing RLS policies", "cue": "How do you check that a policy really blocks other users, given that the SQL Editor often bypasses RLS?", "category": "Security practice", "frequency": "Medium", "importance": "5", "origin": "A policy that is wrong either leaks data or blocks users, and the dashboard tools can hide this, so policies need testing as real users.", "pro_tip": "Test with at least two users and the anon role, and try to read and write each other's rows.", "memory_story": "Testing a policy is trying to pick your own lock from outside.", "visual": "Two user sessions trying to read each other's rows, and one being refused.", "emotion": "The confidence of a lock you have actually tried to break.", "definition": "Testing RLS means trying real reads and writes as different users and roles, such as an owner, a stranger and an anonymous visitor, and checking that only the allowed ones succeed.", "explanation": "The SQL Editor usually runs as a powerful role, so results there do not show what users experience. Test through supabase-js signed in as test users, or use the dashboard's option to run queries as another role or user, or set the role and token claims in SQL. Automated tests can create users and assert results. Also check that insert and update cannot assign rows to someone else.", "simple_explain": "Make two test users and an anonymous client. Try every operation as each, and confirm that strangers get nothing and cannot write to another user's rows.", "analogy": "It is like trying to pick your own lock from outside.", "formula_rule": "Test as owner, stranger and anonymous visitor for every operation", "example_1": "User A reading user B's todos and getting an empty list.", "example_2": "An anonymous client trying to insert and being refused.", "example_3": "A test that checks a user cannot change user_id to someone else's.", "related": "policies, auth.uid(), SQL Editor, service role bypass", "word_family": "test, impersonate, role, policy, assertion", "where_used": "Before launch | Pull request checks | Security reviews", "mini_conversation": "A: My policy works in the SQL Editor. | B: The editor bypasses RLS, so test it signed in as a normal user.", "misconception": "✗ If a query works in the SQL Editor then the policy is correct → ✓ The SQL Editor often bypasses RLS, so you must test as real users", "contrast": "Editor test vs client test: the editor may ignore policies, a client test shows what users really get.", "avoid": "Do not ship policies you have only tried as an admin.", "memory_trick": "Test as the user, not as the admin.", "real_project": "Writing automated tests that sign in as two users and check isolation.", "real_interview": "An interviewer may ask: How do you test Row Level Security?", "real_daily": "It is like trying to pick your own lock from outside.", "mcq_question": "Why can an SQL Editor test mislead you about RLS?", "mcq_options": "A) It may run as a role that bypasses RLS B) It cannot run SQL C) It only reads D) It deletes policies", "mcq_answer": "A", "mcq_why": "A powerful role ignores policies, hiding mistakes.", "fill_blank": "You should test as the owner, a stranger and an ____ visitor → anonymous", "apply": "How can you prove user A cannot read user B's rows? → Sign in as A with the client and query B's rows expecting none", "explain_task": "Explain how to test RLS in three lines.", "own_task": "Write three tests for a todos policy.", "id": "SUP-034", "topic": "05 Row Level Security", "level": "Advanced", "type": "topic56"}, {"term": "Storage buckets", "cue": "In Supabase Storage, what is the top-level container for files, such as one for avatars and one for documents?", "category": "Storage concept", "frequency": "Very high", "importance": "5", "origin": "Files need to be grouped and protected differently, so storage organises them into named buckets, each with its own rules.", "pro_tip": "Create separate buckets for public images and private documents, so their rules stay simple.", "memory_story": "A bucket is a labelled cupboard, and each file is a folder inside it.", "visual": "A cupboard labelled avatars with files and folders inside.", "emotion": "The tidiness of keeping files in clearly named places.", "definition": "A bucket is a named container in Supabase Storage that holds files and folders and can be public or private.", "explanation": "You create buckets in the dashboard or with SQL or the client. Files inside have a path such as user1/avatar.png. Each bucket can have size limits, allowed file types, and a public or private setting. Access to private buckets is controlled by storage policies.", "simple_explain": "Make a bucket for each kind of file, like avatars or lesson-audio. Inside it you store files under paths, and choose whether the bucket is public.", "analogy": "It is like a labelled cupboard where each file is a folder inside.", "formula_rule": "Bucket → folders → files", "example_1": "A public bucket named avatars for profile pictures.", "example_2": "A private bucket named recordings for student audio.", "example_3": "A bucket with a limit on file size.", "related": "upload, public vs private buckets, storage policies, signed URLs", "word_family": "bucket, object, path, folder, policy", "where_used": "Images | Audio and video | Documents", "mini_conversation": "A: Where do I keep uploaded images? | B: Create a storage bucket and upload them there.", "misconception": "✗ Buckets are folders inside the database tables → ✓ Buckets are containers in Storage, separate from tables, though their metadata lives in the database", "contrast": "Bucket vs folder: a bucket is the top-level container, a folder is a path inside it.", "avoid": "Do not mix public and private files in one bucket.", "memory_trick": "A bucket is a cupboard for files.", "real_project": "Creating a private bucket for all student speaking recordings.", "real_interview": "An interviewer may ask: What is a storage bucket?", "real_daily": "It is like a labelled cupboard.", "mcq_question": "What is the top-level container in Supabase Storage?", "mcq_options": "A) Bucket B) Table C) Index D) Policy", "mcq_answer": "A", "mcq_why": "Files are stored inside buckets.", "fill_blank": "A file in a bucket is addressed by its ____ → path", "apply": "How would you keep public pictures apart from private documents? → Use separate buckets with different settings", "explain_task": "Explain buckets in three lines.", "own_task": "List the buckets for an app with avatars, audio and reports.", "id": "SUP-035", "topic": "06 Storage", "level": "Beginner", "type": "topic56"}, {"term": "Uploading a file", "cue": "Which supabase-js call uploads a file to a bucket under a chosen path?", "kind": "JavaScript method", "frequency": "Very high", "importance": "5", "origin": "Apps need to accept pictures and documents from users, so the storage client uploads a file to a bucket in a single call.", "pro_tip": "Put each user's files under a folder named after their user id, so policies can match the folder.", "memory_story": "Uploading is posting a parcel into a labelled cupboard at a specific shelf path.", "visual": "A file leaving the browser and arriving at a path in a bucket.", "emotion": "The pleasure of seeing an uploaded picture appear.", "meaning": "storage.from(bucket).upload(path, file) saves a file at the given path in a bucket.", "code": "const { data, error } = await supabase.storage\n  .from(\"avatars\")\n  .upload(\"user-123/avatar.png\", file, { upsert: true, contentType: \"image/png\" });\nif (error) throw error;", "output": "The file is saved at user-123/avatar.png in the avatars bucket.", "explanation": "By default upload fails if a file already exists at that path, and upsert true replaces it. The path is the object's name, and folders are part of it. The call must pass the bucket's storage policies, so a user may only upload where a policy allows. Always check the error value.", "simple_explain": "Choose the bucket, give a path, and pass the file. Use a folder per user and handle errors, since policies may refuse the upload.", "analogy": "It is like posting a parcel into a labelled cupboard at a specific shelf path.", "syntax": "supabase.storage.from(\"bucket\").upload(\"path/name.ext\", file, options)", "anatomy": "from = which bucket | upload = save | path = the object name | options = upsert, contentType", "example_1": "await supabase.storage.from(\"avatars\").upload(\"user-123/avatar.png\", file);", "example_2": "await supabase.storage.from(\"recordings\").upload(`${userId}/lesson1.webm`, blob);", "example_3": "await supabase.storage.from(\"avatars\").remove([\"user-123/avatar.png\"]);", "variation": "{ upsert: true }   // replace an existing file\n{ cacheControl: \"3600\" }   // set caching", "used_with": "buckets, storage policies, public URL, signed URL", "related": "buckets, storage policies, signed URLs", "alternatives": "Uploading through your own server with the service role", "where_used": "Profile pictures | Audio uploads | Document submission", "mini_conversation": "A: My upload fails because the file already exists. | B: Use upsert true to replace it, or choose a new path.", "misconception": "✗ Anyone can upload to any bucket with the client key → ✓ Uploads must pass storage policies, and without a matching policy they are refused", "confused_with": "upload vs update: upload creates a file (or replaces it with upsert), update replaces an existing file.", "avoid": "Do not upload without checking the returned error.", "wrong_code": "await supabase.storage.upload(\"avatars\", \"avatar.png\", file);", "right_code": "await supabase.storage.from(\"avatars\").upload(\"user-123/avatar.png\", file);", "memory_trick": "from picks the bucket, upload picks the path.", "real_project": "Letting students upload recordings into their own folder.", "real_interview": "An interviewer may ask: How would you restrict who can upload to a bucket?", "real_daily": "It is like posting a parcel to a shelf in a cupboard.", "mcq_question": "Which part of the chain picks the bucket?", "mcq_options": "A) from B) upload C) path D) data", "mcq_answer": "A", "mcq_why": "from(\"bucket\") selects the bucket.", "fill_blank": "await supabase.storage.from(\"avatars\").____(\"a/b.png\", file); → upload", "hindi_to_task": "Upload a file to the avatars bucket at user-1/me.png.", "task_answer": "await supabase.storage.from(\"avatars\").upload(\"user-1/me.png\", file);", "own_task": "Write an upload function that stores a file under the user's folder.", "practice_question": "What does upsert true do?", "practice_answer": "It replaces a file that already exists at that path.", "id": "SUP-036", "topic": "06 Storage", "level": "Beginner", "type": "code56"}, {"term": "Public vs private buckets", "cue": "Which bucket setting decides whether anyone with the link can open a file or access needs permission?", "category": "Storage concept", "frequency": "Very high", "importance": "5", "origin": "Some files, such as logos, should open for anyone, while others, such as reports, must stay private, so each bucket is either public or private.", "pro_tip": "Make a bucket public only when every file in it may be seen by anybody.", "memory_story": "A public bucket is a notice board, and a private bucket is a locked cupboard with a guest list.", "visual": "A file with an open link on one side and a locked file on the other.", "emotion": "The care of deciding who may see a file.", "definition": "Files in a public bucket can be fetched by anyone who knows the URL, while files in a private bucket need permission through policies or a signed URL.", "explanation": "For public buckets, getPublicUrl builds the address, and no login is needed to read the file, though uploads still need policies. For private buckets, reads go through the API with a valid session and a matching policy, or through a time-limited signed URL. Use private buckets for personal data.", "simple_explain": "Public means anyone with the link can open it. Private means you need a logged-in user with permission, or a temporary signed link.", "analogy": "A public bucket is a notice board, and a private bucket is a locked cupboard with a guest list.", "formula_rule": "Public = open by URL. Private = policy or signed URL.", "example_1": "A public bucket for product images.", "example_2": "A private bucket for student recordings.", "example_3": "A public logo bucket where only admins can upload.", "related": "buckets, signed URLs, storage policies", "word_family": "public, private, getPublicUrl, signed URL, policy", "where_used": "Website images | Personal documents | Recordings", "mini_conversation": "A: Can users open each other's recordings by guessing the link? | B: Not if the bucket is private and guarded by policies.", "misconception": "✗ Making a bucket public only allows the owner to see it → ✓ A public bucket lets anyone with the URL read its files", "contrast": "Public vs private bucket: public files open by link, private files need permission.", "avoid": "Do not put personal data in a public bucket.", "memory_trick": "Public is open to all, private needs a pass.", "real_project": "Keeping profile pictures public while keeping student recordings private.", "real_interview": "An interviewer may ask: How do you serve private files safely?", "real_daily": "It is like a notice board versus a locked cupboard.", "mcq_question": "Who can read a file in a public bucket?", "mcq_options": "A) Anyone with the URL B) Only the uploader C) Only admins D) Nobody", "mcq_answer": "A", "mcq_why": "Public buckets serve files to anyone who has the link.", "fill_blank": "A private file can be shared temporarily with a ____ URL → signed", "apply": "Which bucket type should hold personal recordings? → A private bucket", "explain_task": "Explain public and private buckets in three lines.", "own_task": "Choose public or private for five kinds of files and say why.", "id": "SUP-037", "topic": "06 Storage", "level": "Beginner", "type": "topic56"}, {"term": "Signed URLs", "cue": "How do you give someone a temporary link to a file in a private bucket?", "kind": "JavaScript method", "frequency": "High", "importance": "4", "origin": "Private files should not be open forever, so Supabase can create a link that works only for a limited time.", "pro_tip": "Create the signed URL on demand with a short life, instead of storing it.", "memory_story": "A signed URL is a visitor pass that stops working after a set time.", "visual": "A link with a clock on it that expires.", "emotion": "The comfort of sharing a file without making it public.", "meaning": "createSignedUrl returns a link that lets anyone with it read one private file until it expires.", "code": "const { data, error } = await supabase.storage\n  .from(\"recordings\")\n  .createSignedUrl(\"user-123/lesson1.webm\", 60);\nif (error) throw error;\nconsole.log(data.signedUrl);", "output": "A long URL that opens the file for the next sixty seconds.", "explanation": "The second argument is the number of seconds the link stays valid. The caller must have permission to read the file through policies, so a stranger cannot create links to other users' files. Anyone who holds the link can open the file until it expires, so keep lifetimes short and avoid logging links.", "simple_explain": "Ask for a signed URL with an expiry in seconds. Use it right away, for example as the source of an audio player, and let it expire.", "analogy": "It is like a visitor pass that stops working after a set time.", "syntax": "supabase.storage.from(\"bucket\").createSignedUrl(\"path\", seconds)", "anatomy": "createSignedUrl = make a temporary link | path = which file | seconds = how long it lasts", "example_1": "await supabase.storage.from(\"recordings\").createSignedUrl(\"a/b.webm\", 60);", "example_2": "await supabase.storage.from(\"reports\").createSignedUrl(\"2026/report.pdf\", 300);", "example_3": "await supabase.storage.from(\"recordings\").createSignedUrls([\"a.webm\", \"b.webm\"], 60);", "variation": "createSignedUploadUrl(\"path\")   // a link that allows one upload", "used_with": "private buckets, storage policies, audio and video players", "related": "public vs private buckets, storage policies, upload", "alternatives": "Making the bucket public, if the files are not sensitive", "where_used": "Private downloads | Audio playback | Document sharing", "mini_conversation": "A: I want to play a private recording in the browser. | B: Create a signed URL for a few minutes and use it as the audio source.", "misconception": "✗ A signed URL stays valid forever → ✓ A signed URL expires after the time you give it", "confused_with": "Signed URL vs public URL: a signed URL expires and needs permission to create, a public URL is permanent.", "avoid": "Do not create very long-lived signed URLs for sensitive files.", "wrong_code": "await supabase.storage.from(\"recordings\").createSignedUrl(\"user-123/lesson1.webm\");", "right_code": "await supabase.storage.from(\"recordings\").createSignedUrl(\"user-123/lesson1.webm\", 60);", "memory_trick": "A signed URL always expires after a while.", "real_project": "Playing a student's private recording through a link that lasts a few minutes.", "real_interview": "An interviewer may ask: How do you share a private file temporarily?", "real_daily": "It is like a visitor pass that expires.", "mcq_question": "What is the second argument of createSignedUrl?", "mcq_options": "A) How many seconds the link lasts B) The bucket C) The file size D) The user id", "mcq_answer": "A", "mcq_why": "It sets the lifetime of the link in seconds.", "fill_blank": "createSignedUrl(\"path\", ____) sets the expiry in seconds → 60", "hindi_to_task": "Create a signed link for reports/a.pdf that lasts five minutes.", "task_answer": "await supabase.storage.from(\"reports\").createSignedUrl(\"a.pdf\", 300);", "own_task": "Write code that gets a signed URL and puts it in an audio element.", "practice_question": "Who can open a signed URL?", "practice_answer": "Anyone who holds it, until it expires.", "id": "SUP-038", "topic": "06 Storage", "level": "Intermediate", "type": "code56"}, {"term": "Storage policies", "cue": "Which policies control who may upload, read, update or delete files, and which table do they apply to?", "kind": "SQL statement", "frequency": "High", "importance": "5", "origin": "Files need the same kind of rules as table rows, so Storage keeps file records in a table and lets you write RLS policies on it.", "pro_tip": "Use the folder name as the owner, such as a folder named after the user id, and match it in the policy.", "memory_story": "Storage policies are the rules on the cupboard door, checking who is allowed to put in or take out.", "visual": "A policy matching the first folder of a file path with the logged-in user's id.", "emotion": "The relief of file access following the same rules as data.", "meaning": "Storage policies are RLS policies on the storage.objects table that decide which users may act on which files.", "code": "create policy \"Users upload to own folder\" on storage.objects\n  for insert to authenticated\n  with check (\n    bucket_id = 'avatars'\n    and (storage.foldername(name))[1] = (select auth.uid())::text\n  );", "output": "A logged-in user can upload only to a path whose first folder equals their own user id, in the avatars bucket.", "explanation": "Every file is a row in storage.objects with its bucket_id and name. The helper storage.foldername(name) returns the folder parts of the path, and the first part is at position one. Without a matching policy, uploads and private reads are refused. You can write separate policies for select, insert, update and delete.", "simple_explain": "Write a policy on storage.objects that checks the bucket and the folder. Put each user's files in a folder named after their id, and the policy enforces it.", "analogy": "It is like rules on the cupboard door, checking who may put in or take out.", "syntax": "create policy name on storage.objects for operation to role using or with check (condition);", "anatomy": "storage.objects = table of files | bucket_id = which bucket | storage.foldername(name) = folder parts of the path", "example_1": "with check (bucket_id = 'avatars' and (storage.foldername(name))[1] = (select auth.uid())::text)", "example_2": "using (bucket_id = 'recordings' and (storage.foldername(name))[1] = (select auth.uid())::text)", "example_3": "create policy \"Public read avatars\" on storage.objects for select using (bucket_id = 'avatars');", "variation": "for delete using (...)   // control who may delete\nto anon   // allow logged-out users", "used_with": "buckets, auth.uid(), upload, signed URLs", "related": "Row Level Security, upload, public vs private buckets", "alternatives": "Uploading through a server that uses the service role", "where_used": "User folders | Private recordings | Admin-only uploads", "mini_conversation": "A: Users get a policy error when uploading. | B: Add an insert policy on storage.objects that matches the user's folder.", "misconception": "✗ Bucket settings alone control who can upload → ✓ Uploads and private reads need policies on storage.objects too", "confused_with": "Table policy vs storage policy: table policies guard rows, storage policies guard file objects in storage.objects.", "avoid": "Do not write storage policies that ignore the bucket id.", "wrong_code": "create policy \"upload\" on storage.objects for insert with check (true);", "right_code": "create policy \"upload own\" on storage.objects for insert to authenticated with check (bucket_id = 'avatars' and (storage.foldername(name))[1] = (select auth.uid())::text);", "memory_trick": "Folder name equals user id.", "real_project": "Letting each student upload and read only their own recordings.", "real_interview": "An interviewer may ask: How do you restrict file access per user?", "real_daily": "It is like rules on a cupboard door.", "mcq_question": "On which table are storage policies written?", "mcq_options": "A) storage.objects B) public.todos C) auth.users D) pg_class", "mcq_answer": "A", "mcq_why": "Every file is a row in storage.objects.", "fill_blank": "storage.____(name) returns the folders of a file path → foldername", "hindi_to_task": "Allow anyone to read files in the public-images bucket.", "task_answer": "create policy \"Public read\" on storage.objects for select using (bucket_id = 'public-images');", "own_task": "Write a policy that lets users delete only their own files.", "practice_question": "Which helper function splits a path into folders?", "practice_answer": "storage.foldername(name)", "id": "SUP-039", "topic": "06 Storage", "level": "Advanced", "type": "code56"}, {"term": "Realtime (Postgres changes)", "cue": "How can your app receive a message the moment a row is inserted, updated or deleted in a table?", "kind": "JavaScript method", "frequency": "High", "importance": "4", "origin": "Apps such as chats and dashboards need to update without refreshing, so Supabase streams database changes to subscribed clients over a websocket.", "pro_tip": "Enable realtime for the table first, and remember RLS still decides which changes each user receives.", "memory_story": "Realtime is a doorbell wired to the table that rings whenever something changes.", "visual": "A table change sending a signal to open browser windows.", "emotion": "The delight of seeing data update live on screen.", "meaning": "A channel subscribed to postgres_changes calls your function whenever matching rows change.", "code": "const channel = supabase\n  .channel(\"todos-changes\")\n  .on(\"postgres_changes\", { event: \"INSERT\", schema: \"public\", table: \"todos\" },\n    (payload) => console.log(\"New todo:\", payload.new))\n  .subscribe();", "output": "Each time a todo is inserted, the console prints New todo with the new row.", "explanation": "The table must be included in the supabase_realtime publication, which you can enable in the dashboard. The event can be INSERT, UPDATE, DELETE or a star for all. Row Level Security applies to what each subscriber receives. Remove the channel when the component unmounts, with removeChannel.", "simple_explain": "Turn on realtime for the table, create a channel, listen for changes, and subscribe. Remember to remove the channel when you no longer need it.", "analogy": "It is like a doorbell wired to the table that rings whenever something changes.", "syntax": "supabase.channel(name).on(\"postgres_changes\", filter, callback).subscribe()", "anatomy": "channel = a named connection | on = listen for changes | filter = event, schema, table | subscribe = start", "example_1": "event: \"INSERT\", schema: \"public\", table: \"todos\"", "example_2": "event: \"*\", schema: \"public\", table: \"messages\"", "example_3": "supabase.removeChannel(channel)", "variation": "filter: \"room_id=eq.5\"   // only changes for one room", "used_with": "websockets, publication, RLS, removeChannel", "related": "Broadcast and Presence, Row Level Security, triggers", "alternatives": "Polling the table on a timer", "where_used": "Chat | Live dashboards | Collaborative apps", "mini_conversation": "A: New messages do not show until I refresh. | B: Subscribe to INSERT changes on the messages table.", "misconception": "✗ Realtime works on every table automatically → ✓ A table must be added to the realtime publication, and RLS still limits what each user receives", "confused_with": "Realtime vs polling: realtime pushes changes as they happen, polling asks repeatedly.", "avoid": "Do not forget to remove channels when leaving a page.", "wrong_code": "supabase.on(\"postgres_changes\", {}, callback).subscribe();", "right_code": "supabase.channel(\"todos-changes\").on(\"postgres_changes\", { event: \"INSERT\", schema: \"public\", table: \"todos\" }, callback).subscribe();", "memory_trick": "Make a channel, listen, then subscribe.", "real_project": "Showing new chat messages live as other users send them.", "real_interview": "An interviewer may ask: How does Supabase Realtime deliver database changes?", "real_daily": "It is like a doorbell wired to the table.", "mcq_question": "What must you do for a table before listening to its changes?", "mcq_options": "A) Add it to the realtime publication B) Delete its rows C) Make a bucket D) Rename it", "mcq_answer": "A", "mcq_why": "Only tables in the publication send change events.", "fill_blank": "Stop listening with supabase.____(channel) → removeChannel", "hindi_to_task": "Listen to every change on the messages table.", "task_answer": "supabase.channel(\"m\").on(\"postgres_changes\", { event: \"*\", schema: \"public\", table: \"messages\" }, (p) => console.log(p)).subscribe();", "own_task": "Write a subscription that shows new comments live.", "practice_question": "Which events can you listen for?", "practice_answer": "INSERT, UPDATE, DELETE, or all of them.", "id": "SUP-040", "topic": "07 Realtime and functions", "level": "Intermediate", "type": "code56"}, {"term": "Broadcast and Presence", "cue": "Which two Realtime features send short messages between clients and track who is currently online?", "category": "Realtime feature", "frequency": "Medium", "importance": "3", "origin": "Some live features, such as typing indicators and cursors, do not belong in the database, so Realtime offers lightweight messages and shared state between connected clients.", "pro_tip": "Use Broadcast for ephemeral events and Presence for who-is-here state, and keep the database for data you must keep.", "memory_story": "Broadcast is shouting across a room, and Presence is the list of who is currently standing in it.", "visual": "Messages flying between browser windows and a list of online names.", "emotion": "The fun of seeing other people's cursors move live.", "definition": "Broadcast sends low-latency messages between clients subscribed to a channel, and Presence keeps a shared record of which clients are online with their state.", "explanation": "Both work through a channel. With Broadcast, a client sends an event and others receive it, with nothing stored in the database. With Presence, each client tracks its own state, such as a name or status, and everyone can see the combined list, which updates when people join or leave.", "simple_explain": "Use Broadcast for things like typing or cursor movements, and Presence for an online users list. Neither needs a table.", "analogy": "Broadcast is shouting across a room, and Presence is the list of who is standing in it.", "formula_rule": "Broadcast = messages between clients. Presence = who is online and their state.", "example_1": "A typing indicator sent through Broadcast.", "example_2": "A list of users in a room shown with Presence.", "example_3": "Live cursors in a shared whiteboard.", "related": "Realtime Postgres changes, channels, websockets", "word_family": "channel, broadcast, presence, track, sync", "where_used": "Collaboration tools | Games | Live classrooms", "mini_conversation": "A: How do I show who is online in this class? | B: Use Presence on the class channel.", "misconception": "✗ Broadcast messages are saved in the database → ✓ Broadcast messages are ephemeral and are not stored unless you save them yourself", "contrast": "Broadcast vs Postgres changes: Broadcast sends client messages, Postgres changes stream database row changes.", "avoid": "Do not rely on Broadcast for data that must be kept.", "memory_trick": "Broadcast shouts and presence keeps a list.", "real_project": "Showing which students are currently in a live practice room.", "real_interview": "An interviewer may ask: What is the difference between Broadcast and Presence?", "real_daily": "It is like shouting across a room and keeping a list of who is in it.", "mcq_question": "Which feature shows a list of online users?", "mcq_options": "A) Presence B) Broadcast C) Storage D) Auth", "mcq_answer": "A", "mcq_why": "Presence tracks who is connected and their state.", "fill_blank": "Short-lived messages between clients use ____ → Broadcast", "apply": "How would you show typing indicators? → Send them through Broadcast on a channel", "explain_task": "Explain Broadcast and Presence in three lines.", "own_task": "List two features of your app that need Presence.", "id": "SUP-041", "topic": "07 Realtime and functions", "level": "Intermediate", "type": "topic56"}, {"term": "Edge Functions", "cue": "Which Supabase feature runs your own TypeScript server code close to users, such as for secrets or third-party calls?", "kind": "Server-side function", "frequency": "High", "importance": "4", "origin": "Some work cannot happen in the browser, such as using secret keys or receiving webhooks, so Supabase lets you deploy small server-side functions without managing servers.", "pro_tip": "Keep secrets in function secrets and call third-party APIs from here, never from the browser.", "memory_story": "Picture a tiny kitchen beside the dining room that cooks the dishes guests must not prepare themselves.", "visual": "A small function box between the browser and the outside world.", "emotion": "The relief of server logic with no server to manage.", "meaning": "An Edge Function is a small TypeScript function that runs on Deno on Supabase's infrastructure and is called over HTTP.", "code": "Deno.serve(async (req) => {\n  const { name } = await req.json();\n  return new Response(JSON.stringify({ message: `Hello ${name}` }), {\n    headers: { \"Content-Type\": \"application/json\" },\n  });\n});", "output": "A call with the body {\"name\": \"Asha\"} returns {\"message\": \"Hello Asha\"}.", "explanation": "You write the function in your project's supabase/functions folder, and deploy it with supabase functions deploy name. Secrets are set with the CLI and read through Deno.env. From the client you call it with supabase.functions.invoke, which also forwards the user's token. Typical uses are calling payment or email providers, receiving webhooks and running scheduled jobs.", "simple_explain": "Write a function, deploy it, and call it from your app. Use it for anything that needs secrets or must run on the server.", "analogy": "It is like a small kitchen beside the dining room for tasks guests must not do themselves.", "syntax": "supabase.functions.invoke(\"name\", { body })", "anatomy": "Deno.serve = handle requests | invoke = call from the client | secrets = set with the CLI", "example_1": "await supabase.functions.invoke(\"hello\", { body: { name: \"Asha\" } });", "example_2": "A function that calls an email provider with a secret key.", "example_3": "A function that receives a payment webhook.", "variation": "supabase functions deploy hello   // publish the function\nsupabase secrets set EMAIL_KEY=...   // store a secret", "used_with": "Deno, secrets, CLI, webhooks", "related": "webhooks, database functions, environment variables", "alternatives": "Your own server or another serverless platform", "where_used": "Third-party API calls | Webhook receivers | Scheduled jobs", "mini_conversation": "A: Where should the email API key live? | B: In an edge function secret, called from the app through the function.", "misconception": "✗ Edge Functions are the same as database functions → ✓ Edge Functions run TypeScript outside the database, while database functions run inside Postgres", "confused_with": "Edge Function vs database function: one runs your TypeScript on Deno, the other runs SQL inside Postgres.", "avoid": "Do not put secret keys in front-end code, use a function.", "wrong_code": "const key = \"my-email-secret\"; // inside browser code", "right_code": "const key = Deno.env.get(\"EMAIL_KEY\"); // inside an edge function", "memory_trick": "Secrets stay inside the function.", "real_project": "Sending a welcome email from an edge function after signup.", "real_interview": "An interviewer may ask: When would you use an Edge Function?", "real_daily": "It is like a small kitchen next to the dining room.", "mcq_question": "Which runtime do Edge Functions use?", "mcq_options": "A) Deno B) Excel C) Flash D) COBOL", "mcq_answer": "A", "mcq_why": "Supabase Edge Functions run on Deno.", "fill_blank": "You call a function from the client with supabase.functions.____ → invoke", "hindi_to_task": "Call a function named hello with the body name set to Ravi.", "task_answer": "await supabase.functions.invoke(\"hello\", { body: { name: \"Ravi\" } });", "own_task": "Write the steps to deploy a function and set a secret for it.", "practice_question": "How do you publish a function?", "practice_answer": "supabase functions deploy <name>", "id": "SUP-042", "topic": "07 Realtime and functions", "level": "Advanced", "type": "code56"}, {"term": "Database functions and triggers", "cue": "Which two Postgres features let the database run code automatically when a row is inserted, such as creating a profile for each new user?", "kind": "SQL concept", "frequency": "High", "importance": "4", "origin": "Some rules must always happen whenever data changes, whatever the app does, so Postgres lets you attach functions to table events through triggers.", "pro_tip": "Use a trigger on auth.users to create a profile row automatically for each new sign-up.", "memory_story": "A trigger is a tripwire, and the function is the alarm it sets off.", "visual": "A new row appearing and a second row being created by itself.", "emotion": "The comfort of rules that never get forgotten.", "meaning": "A trigger runs a function automatically before or after an insert, update or delete on a table.", "code": "create function public.handle_new_user() returns trigger\nlanguage plpgsql security definer set search_path = '' as $$\nbegin\n  insert into public.profiles (id) values (new.id);\n  return new;\nend;\n$$;\ncreate trigger on_auth_user_created\n  after insert on auth.users\n  for each row execute function public.handle_new_user();", "output": "Each new user in auth.users automatically gets a matching row in public.profiles.", "explanation": "The function returns trigger and can read the new row through new. It is security definer so it can write to your table, and setting search_path avoids hijacking risks. The trigger says when to run it, such as after insert, and for each row. Triggers work whatever client changed the data, so rules cannot be skipped.", "simple_explain": "Write a function, then attach it with a trigger to a table event. From then on the database runs it every time the event occurs.", "analogy": "It is like a tripwire that sets off an alarm automatically.", "syntax": "create trigger name after insert on table for each row execute function fn();", "anatomy": "function = the code to run | trigger = when to run it | new = the row that was added", "example_1": "create trigger on_auth_user_created after insert on auth.users for each row execute function public.handle_new_user();", "example_2": "A trigger that sets updated_at before each update.", "example_3": "A trigger that writes a row into an audit log after each delete.", "variation": "before update   // run before the change\nfor each statement   // once per statement, not per row", "used_with": "plpgsql, security definer, auth.users, profiles", "related": "RPC, Supabase Auth, database webhooks", "alternatives": "Doing the same step in application code", "where_used": "Profile creation | Audit logs | Timestamps", "mini_conversation": "A: How do I create a profile for every new user? | B: Add a trigger on auth.users that inserts into profiles.", "misconception": "✗ Triggers only run when my app code calls them → ✓ Triggers run inside the database whenever the event happens, whichever client caused it", "confused_with": "Function vs trigger: a function holds the code, a trigger decides when it runs.", "avoid": "Do not write security definer functions without setting the search_path.", "wrong_code": "create trigger t on auth.users execute function public.handle_new_user();", "right_code": "create trigger on_auth_user_created after insert on auth.users for each row execute function public.handle_new_user();", "memory_trick": "Function holds the code, trigger fires it.", "real_project": "Creating a profile row for each learner at sign-up.", "real_interview": "An interviewer may ask: What is a trigger in Postgres?", "real_daily": "It is like a tripwire that sets off an alarm.", "mcq_question": "What does a trigger do?", "mcq_options": "A) Runs a function automatically on a table event B) Creates a bucket C) Sends an email directly D) Renames a column", "mcq_answer": "A", "mcq_why": "A trigger executes a function when a table event occurs.", "fill_blank": "Inside a row trigger, the row that was just added is available as ____ → new", "hindi_to_task": "Name the clause that runs a trigger after a row is inserted.", "task_answer": "after insert on table_name for each row execute function fn();", "own_task": "Write a trigger plan that updates updated_at on every change.", "practice_question": "What does security definer do for a function?", "practice_answer": "It runs the function with the owner's rights instead of the caller's.", "id": "SUP-043", "topic": "07 Realtime and functions", "level": "Advanced", "type": "code56"}, {"term": "Database webhooks", "cue": "Which feature sends an HTTP request to a URL automatically when a table row is inserted, updated or deleted?", "category": "Integration feature", "frequency": "Medium", "importance": "3", "origin": "Other systems often need to know when data changes, so Supabase can call a URL whenever a table event occurs, built on triggers.", "pro_tip": "Point a database webhook at an Edge Function, and verify the request in that function.", "memory_story": "A database webhook is a doorbell that rings another system when your data changes.", "visual": "A row change sending an HTTP request with a JSON body to a URL.", "emotion": "The ease of connecting data changes to other tools.", "definition": "A database webhook is a trigger-based feature that sends an HTTP request containing the changed row to a URL when a chosen table event happens.", "explanation": "You configure the table, the events and the destination in the dashboard. The request body carries the event type, the table, the new record and the old record where relevant. It is an easy way to start an email, a notification or a sync after data changes. Treat the receiving URL like any webhook endpoint and verify the call.", "simple_explain": "Choose a table and an event, give a URL, and Supabase calls it with the row data whenever the event happens.", "analogy": "It is like a doorbell that rings another system when your data changes.", "formula_rule": "Table event → HTTP POST with the row → your function or URL", "example_1": "Calling an Edge Function after each new order is inserted.", "example_2": "Notifying a chat tool when a support ticket is created.", "example_3": "Syncing a deleted record to another system.", "related": "webhooks, Edge Functions, triggers", "word_family": "webhook, trigger, payload, record, event", "where_used": "Notifications | Syncs | Automations", "mini_conversation": "A: How do we send an email when an order is created? | B: Add a database webhook on the orders table that calls an edge function.", "misconception": "✗ A database webhook is the same as the realtime feature → ✓ Realtime pushes changes to subscribed clients, while a database webhook calls a URL from the server side", "contrast": "Database webhook vs Realtime: a webhook calls a URL on the server, Realtime pushes to connected clients.", "avoid": "Do not leave the receiving URL unverified.", "memory_trick": "A data change calls a URL.", "real_project": "Emailing a coach when a student submits a recording.", "real_interview": "An interviewer may ask: How would you react to a new row with server code?", "real_daily": "It is like a doorbell that rings another system.", "mcq_question": "What does a database webhook send?", "mcq_options": "A) An HTTP request about a row change B) A file C) A password D) A table", "mcq_answer": "A", "mcq_why": "It calls a URL with the details of the change.", "fill_blank": "A database webhook is built on a ____ → trigger", "apply": "How do you send an email when a row is inserted? → Add a database webhook that calls an Edge Function", "explain_task": "Explain database webhooks in three lines.", "own_task": "Write two events in your app that deserve a database webhook.", "id": "SUP-044", "topic": "07 Realtime and functions", "level": "Advanced", "type": "topic56"}, {"term": "Connection pooling (transaction vs session mode)", "cue": "Why do serverless apps connect to Supabase through a pooler, and how do the transaction and session modes differ?", "category": "Production concept", "frequency": "High", "importance": "5", "origin": "Each Postgres connection is expensive and the number is limited, so a pooler sits in front of the database and shares a small set of real connections among many clients.", "pro_tip": "Use transaction mode for serverless and short-lived connections, and a direct or session connection for migrations and long-lived sessions.", "memory_story": "A pooler is a receptionist who shares a few phone lines among many callers.", "visual": "Many app connections funnelling into a few database connections.", "emotion": "The relief of an app that does not crash under too many connections.", "definition": "Connection pooling reuses a small number of database connections for many clients, and in transaction mode a connection is held only for the length of one transaction, while session mode holds it for a whole client session.", "explanation": "Supabase provides a pooler, so apps do not open too many direct connections. Transaction mode, commonly on port 6543, suits serverless functions because connections are returned after each transaction, but it does not support some session features such as prepared statements. Session mode, commonly on port 5432 through the pooler, keeps one connection per client and has a limit on clients. The direct connection goes straight to the database, and depends on IPv6 unless you add IPv4 support, so copy the exact strings from your dashboard.", "simple_explain": "Do not let every serverless function open its own database connection. Connect through the pooler in transaction mode, and use the direct or session string only for tasks like migrations.", "analogy": "A pooler is a receptionist who shares a few phone lines among many callers.", "formula_rule": "Serverless app → pooler (transaction mode) → database. Migrations → direct or session connection.", "example_1": "A Next.js app on serverless hosting using the transaction pooler string.", "example_2": "A migration command using the direct connection string.", "example_3": "Too many connections errors disappearing after switching to the pooler.", "related": "Prisma and Supabase, connection strings, serverless, migrations", "word_family": "pooler, transaction mode, session mode, direct connection, port", "where_used": "Serverless hosting | ORMs such as Prisma | High-traffic apps", "mini_conversation": "A: Our app runs out of connections on serverless. | B: Switch to the transaction pooler connection string.", "misconception": "✗ Every app should connect directly to the database for the best speed → ✓ Serverless and high-traffic apps should use the pooler to avoid exhausting connections", "contrast": "Transaction vs session mode: transaction mode shares connections per transaction, session mode holds one per client session.", "avoid": "Do not run migrations through the transaction pooler.", "memory_trick": "A pooler shares a few lines among many callers.", "real_project": "Using the transaction pooler for runtime and the session or direct string for migrations.", "real_interview": "An interviewer may ask: Why use a connection pooler with serverless?", "real_daily": "It is like a receptionist who shares a few phone lines among many callers.", "mcq_question": "Which mode suits serverless functions?", "mcq_options": "A) Transaction mode B) Session mode only C) No pooling D) Read-only mode", "mcq_answer": "A", "mcq_why": "Transaction mode releases connections after each transaction, which suits short-lived functions.", "fill_blank": "A pooler shares a few real ____ among many clients → connections", "apply": "Migrations fail through the transaction pooler. What should you use? → The direct or session connection string", "explain_task": "Explain pooling and its two modes in three lines.", "own_task": "Write which connection string you would use for runtime and for migrations.", "id": "SUP-045", "topic": "08 Production and advanced", "level": "Advanced", "type": "topic56"}, {"term": "Backups and recovery", "cue": "What protects you if data is deleted by mistake, and how can you take your own copy of the database?", "category": "Production concept", "frequency": "Medium", "importance": "4", "origin": "Mistakes and failures happen, so production databases need copies from which they can be restored, and relying on only one copy is risky.", "pro_tip": "Check what backups your plan includes, and also keep your own regular dumps for important data.", "memory_story": "Backups are spare keys kept in a safe place, which you hope never to need.", "visual": "A clock face with saved copies at earlier times.", "emotion": "The calm of knowing a mistake can be undone.", "definition": "Backups are saved copies of the database that let you restore it after data loss, and Supabase offers automatic backups on some plans, and optional point-in-time recovery.", "explanation": "What is included depends on your plan, so check the dashboard and current documentation. Point-in-time recovery lets you restore to a chosen moment, as an add-on. You can also take your own dump with the CLI, such as supabase db dump, and keep it elsewhere. Test a restore before you need it, because an untested backup is only a hope.", "simple_explain": "Know what your plan backs up, keep your own dumps for important data, and practise restoring them.", "analogy": "It is like spare keys kept in a safe place.", "formula_rule": "Plan backups + your own dumps + tested restores", "example_1": "Daily backups on a paid plan.", "example_2": "Taking a dump with the CLI before a risky migration.", "example_3": "Restoring to a new project to check that a backup works.", "related": "migrations, local development, production", "word_family": "backup, restore, dump, point-in-time recovery", "where_used": "Production projects | Before big changes | Disaster recovery", "mini_conversation": "A: Someone deleted a table by mistake. | B: Check the backups, and restore from the latest copy or point in time.", "misconception": "✗ Backups are only needed after something goes wrong → ✓ Backups must be set up and tested beforehand, because they cannot be created after data is lost", "contrast": "Backup vs migration: a backup saves the data, a migration records the structure changes.", "avoid": "Do not assume every plan includes the backups you need.", "memory_trick": "Test the restore before you need it.", "real_project": "Dumping the database before running a risky migration.", "real_interview": "An interviewer may ask: How would you recover from accidental
