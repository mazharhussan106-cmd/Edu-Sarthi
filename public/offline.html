<!doctype html>
<!-- Shown by the service worker when a page cannot load with no connection.
     Self-contained on purpose: no stylesheet, font or script can be fetched
     while offline, so everything it needs is inline. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You are offline · Edusarthi</title>
<style>
  :root { color-scheme: light dark; --ink:#1a1420; --muted:#6b6470; --paper:#faf7f9; --btn:#1a1420; --on:#ffffff; }
  @media (prefers-color-scheme: dark) { :root { --ink:#ece7f0; --muted:#928a99; --paper:#120e17; --btn:#ece7f0; --on:#120e17; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--paper); color:var(--ink); font:16px/1.5 system-ui, sans-serif; padding:24px; box-sizing:border-box; }
  main { max-width:340px; text-align:center; }
  h1 { font-size:22px; margin:16px 0 8px; }
  p { color:var(--muted); margin:0 0 20px; }
  button { font:inherit; font-weight:600; border:0; border-radius:10px; padding:12px 20px; background:var(--btn); color:var(--on); }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" width="72" height="72" alt="">
  <h1>No internet connection</h1>
  <p>Edusarthi needs a connection to load your practice and audits. Anything you already sent is safe.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
